<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>طلباتي | سِلّتي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 0 95px;
    font-family: Arial, sans-serif;
    background: #f1f5f3;
    color: #26332d;
}

header {
    background: linear-gradient(135deg, #087f5b, #075b43);
    color: white;
    padding: 27px 16px 30px;
    text-align: center;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

header h2 {
    margin: 0 0 9px;
    font-size: 24px;
}

header p {
    margin: 0;
    font-size: 13px;
    opacity: .92;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 17px 14px;
}

.message {
    background: white;
    padding: 22px 15px;
    border-radius: 15px;
    text-align: center;
    margin: 20px 0;
    color: #64736b;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
    line-height: 1.8;
}

.message button {
    display: block;
    margin: 15px auto 0;
}

.order-card {
    background: white;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
    border: 1px solid #edf1ee;
    animation: appear .35s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.order-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #edf1ee;
    padding-bottom: 14px;
}

.order-head h3 {
    margin: 0;
    color: #087f5b;
    font-size: 16px;
    line-height: 1.6;
}

.status-badge {
    background: #e7f5ed;
    color: #087f5b;
    border-radius: 20px;
    padding: 8px 11px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.status-badge.cancelled {
    background: #ffebee;
    color: #c62828;
}

.status-badge.delivered {
    background: #e3f2fd;
    color: #1565c0;
}

.order-info {
    line-height: 1.9;
    font-size: 13px;
    margin: 13px 0;
    color: #65736b;
}

.order-info p {
    margin: 4px 0;
}

.items {
    background: #f7faf8;
    border: 1px solid #edf1ee;
    border-radius: 12px;
    padding: 12px;
    margin: 13px 0;
    font-size: 13px;
    line-height: 2;
}

.items strong {
    display: block;
    color: #26332d;
    margin-bottom: 5px;
}

.item-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px dashed #e1e8e3;
    padding: 4px 0;
}

.item-line:last-child {
    border-bottom: none;
}

.item-name {
    flex: 1;
}

.item-price {
    color: #526158;
    white-space: nowrap;
}

.total {
    background: #eaf6ef;
    color: #087f5b;
    border-radius: 11px;
    padding: 12px;
    font-size: 17px;
    font-weight: bold;
    margin-top: 12px;
    text-align: center;
}

.tracking {
    margin-top: 17px;
    padding: 16px 13px;
    background: #f8faf9;
    border: 1px solid #edf1ee;
    border-radius: 13px;
}

.tracking h4 {
    margin: 0 0 20px;
    color: #26332d;
    font-size: 14px;
}

.track-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
    min-height: 48px;
}

.track-step:not(:last-child)::after {
    content: "";
    position: absolute;
    right: 10px;
    top: 23px;
    height: 25px;
    width: 2px;
    background: #dce5df;
}

.track-step.done:not(:last-child)::after {
    background: #087f5b;
}

.track-dot {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    background: #e1e8e3;
    color: #7d8981;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    z-index: 1;
}

.track-step.done .track-dot {
    background: #087f5b;
    color: white;
}

.track-label {
    padding-top: 3px;
    font-size: 13px;
    color: #929c95;
    line-height: 1.5;
}

.track-step.done .track-label {
    color: #087f5b;
    font-weight: bold;
}

.track-step.current .track-label {
    color: #26332d;
    font-weight: bold;
}

.cancel-message {
    color: #c62828;
    background: #ffebee;
    border-radius: 10px;
    padding: 13px;
    font-size: 13px;
    margin-top: 15px;
    line-height: 1.8;
    text-align: center;
}

.unknown-status {
    background: #fff8e1;
    color: #8d6e00;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.7;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    background: #087f5b;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:active {
    transform: scale(.97);
}

.footer-note {
    text-align: center;
    color: #87948c;
    font-size: 12px;
    margin: 25px 0 10px;
    line-height: 1.8;
}
</style>
</head>

<body>

<header>
    <h2>📦 طلباتي</h2>
    <p>تابع طلباتك من المتجر حتى باب منزلك 💚</p>
</header>

<div class="container">

    <div id="message" class="message">
        جارٍ تحميل طلباتك...
    </div>

    <div id="ordersContainer"></div>

    <div class="footer-note">
        سِلّتي | دكان حلتك أصبح أقرب إليك 🛒
    </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const message = document.getElementById("message");
const container = document.getElementById("ordersContainer");

let unsubscribeOrders = null;


// مراحل تتبع الطلب
const steps = [
    "جديد",
    "قيد التجهيز",
    "جاهز للتسليم",
    "المندوب في الطريق",
    "تم التسليم"
];


// توحيد أسماء الحالات
function normalizeStatus(status) {

    const aliases = {
        "في الطريق": "المندوب في الطريق",
        "جاري التوصيل": "المندوب في الطريق",
        "قيد التوصيل": "المندوب في الطريق",
        "تم التوصيل": "تم التسليم",
        "مكتمل": "تم التسليم"
    };

    status = String(status || "جديد").trim();

    return aliases[status] || status;
}


// تنسيق التاريخ
function formatDate(order) {

    try {

        if (order.createdAt && order.createdAt.toDate) {
            return order.createdAt.toDate().toLocaleString("ar");
        }

        if (order.date) {
            return order.date;
        }

        return "غير محدد";

    } catch (error) {
        return "غير محدد";
    }
}


// استخراج وقت الطلب للترتيب
function getOrderTime(order) {

    if (order.createdAt && order.createdAt.toMillis) {
        return order.createdAt.toMillis();
    }

    if (order.date) {
        const parsed = new Date(order.date).getTime();

        if (!isNaN(parsed)) {
            return parsed;
        }
    }

    return 0;
}


// حساب إجمالي المنتجات
function calculateItemsTotal(items) {

    if (!Array.isArray(items)) {
        return 0;
    }

    return items.reduce((sum, item) => {

        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;

        return sum + (price * quantity);

    }, 0);
}


// إنشاء شريط التتبع
function createTracking(status) {

    status = normalizeStatus(status);

    if (status === "ملغي") {

        const cancel = document.createElement("div");

        cancel.className = "cancel-message";
        cancel.textContent = "❌ تم إلغاء هذا الطلب.";

        return cancel;
    }

    const currentIndex = steps.indexOf(status);

    if (currentIndex < 0) {

        const unknown = document.createElement("div");

        unknown.className = "unknown-status";
        unknown.textContent =
            "حالة الطلب الحالية: " + status +
            ". سيتم تحديث تفاصيل التتبع عند توفر المرحلة التالية.";

        return unknown;
    }

    const tracking = document.createElement("div");
    tracking.className = "tracking";

    const title = document.createElement("h4");
    title.textContent = "🚚 مراحل توصيل طلبك";

    tracking.appendChild(title);

    steps.forEach((step, index) => {

        const done = index <= currentIndex;
        const current = index === currentIndex;

        const row = document.createElement("div");

        row.className =
            "track-step" +
            (done ? " done" : "") +
            (current ? " current" : "");

        const dot = document.createElement("div");
        dot.className = "track-dot";
        dot.textContent = done ? "✓" : "";

        const label = document.createElement("div");
        label.className = "track-label";

        label.textContent =
            step + (current ? " ← الحالة الحالية" : "");

        row.append(dot, label);

        tracking.appendChild(row);

    });

    return tracking;
}


// إنشاء بطاقة الطلب
function renderOrder(order) {

    const status = normalizeStatus(order.status);

    const card = document.createElement("div");
    card.className = "order-card";

    // رأس الطلب
    const head = document.createElement("div");
    head.className = "order-head";

    const title = document.createElement("h3");

    title.textContent =
        "🏪 " + (order.storeName || "متجر سِلّتي");

    const badge = document.createElement("span");
    badge.className = "status-badge";
    badge.textContent = status;

    if (status === "ملغي") {
        badge.classList.add("cancelled");
    }

    if (status === "تم التسليم") {
        badge.classList.add("delivered");
    }

    head.append(title, badge);


    // معلومات الطلب
    const info = document.createElement("div");
    info.className = "order-info";

    const id = document.createElement("p");

    id.textContent =
        "🔢 رقم الطلب: " + (order.id || "غير محدد");

    const date = document.createElement("p");

    date.textContent =
        "📅 تاريخ الطلب: " + formatDate(order);

    info.append(id, date);


    // المنتجات
    const itemsBox = document.createElement("div");
    itemsBox.className = "items";

    const itemsTitle = document.createElement("strong");
    itemsTitle.textContent = "🛍️ المنتجات";

    itemsBox.appendChild(itemsTitle);

    if (Array.isArray(order.items) && order.items.length > 0) {

        order.items.forEach(item => {

            const line = document.createElement("div");
            line.className = "item-line";

            const name = document.createElement("span");
            name.className = "item-name";

            const quantity = Number(item.quantity) || 1;

            name.textContent =
                (item.name || "منتج") + " × " + quantity;

            const price = document.createElement("span");
            price.className = "item-price";

            price.textContent =
                (
                    (Number(item.price) || 0) * quantity
                ).toLocaleString("ar") + " جنيه";

            line.append(name, price);

            itemsBox.appendChild(line);

        });

    } else {

        const emptyItems = document.createElement("div");
        emptyItems.textContent = "لا توجد تفاصيل للمنتجات.";
        itemsBox.appendChild(emptyItems);

    }


    // الإجمالي
    const total = document.createElement("div");
    total.className = "total";

    const orderTotal =
        order.total !== undefined && order.total !== null
            ? Number(order.total) || 0
            : calculateItemsTotal(order.items);

    total.textContent =
        "الإجمالي: " +
        orderTotal.toLocaleString("ar") +
        " جنيه";


    // التتبع
    const tracking = createTracking(status);

    card.append(head, info, itemsBox, total, tracking);

    container.appendChild(card);
}


// عرض الطلبات
function showOrders(snapshot) {

    container.innerHTML = "";

    if (snapshot.empty) {

        message.style.display = "block";
        message.textContent = "ليس لديك طلبات حتى الآن 🛒";

        return;
    }

    message.style.display = "none";

    const orders = snapshot.docs.map(documentSnapshot => ({
        ...documentSnapshot.data(),
        id: documentSnapshot.id
    }));

    // الأحدث أولاً
    orders.sort((a, b) => {
        return getOrderTime(b) - getOrderTime(a);
    });

    orders.forEach(renderOrder);
}


// متابعة تسجيل الدخول والطلبات
onAuthStateChanged(auth, user => {

    if (unsubscribeOrders) {
        unsubscribeOrders();
        unsubscribeOrders = null;
    }

    container.innerHTML = "";

    if (!user) {

        message.style.display = "block";
        message.textContent = "يرجى تسجيل الدخول لعرض طلباتك.";

        const loginButton = document.createElement("button");

        loginButton.textContent = "تسجيل الدخول";

        loginButton.onclick = () => {
            location.href = "login.html";
        };

        message.appendChild(loginButton);

        return;
    }

    message.style.display = "block";
    message.textContent = "جارٍ تحميل طلباتك...";

    try {

        const ordersQuery = query(
            collection(db, "orders"),
            where("customerId", "==", user.uid)
        );

        unsubscribeOrders = onSnapshot(

            ordersQuery,

            snapshot => {
                showOrders(snapshot);
            },

            error => {

                console.error("Orders error:", error);

                message.style.display = "block";

                message.textContent =
                    "تعذر تحميل الطلبات. تحقق من الاتصال أو صلاحيات Firestore.";

            }

        );

    } catch (error) {

        console.error("Orders setup error:", error);

        message.style.display = "block";

        message.textContent =
            "حدث خطأ أثناء فتح صفحة الطلبات.";

    }

});

</script>

<script src="bottom-nav.js" defer></script>

</body>
</html>
