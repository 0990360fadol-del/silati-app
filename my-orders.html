<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>طلباتي | سِلّتي</title>

<style>
:root {
    --green:#087f5b;
    --green-dark:#075b43;
    --green-light:#e8f5ee;
    --bg:#f1f5f3;
    --text:#26332d;
    --muted:#75847b;
    --border:#e9efeb;
    --shadow:0 7px 24px rgba(24,65,45,.07);
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    margin:0;
    padding:0 0 100px;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    animation:pageIn .35s ease;
}

@keyframes pageIn {
    from {opacity:0;transform:translateY(8px)}
    to {opacity:1;transform:translateY(0)}
}

@keyframes appear {
    from {opacity:0;transform:translateY(12px)}
    to {opacity:1;transform:translateY(0)}
}

@keyframes pulse {
    from {opacity:.3}
    to {opacity:1}
}

/* الرأس */

header {
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:white;
    padding:27px 18px 32px;
    text-align:center;
    border-radius:0 0 27px 27px;
    box-shadow:0 7px 22px rgba(0,0,0,.13);
}

header:before,
header:after {
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

header:before {
    width:180px;
    height:180px;
    top:-90px;
    right:-45px;
}

header:after {
    width:120px;
    height:120px;
    bottom:-75px;
    left:-25px;
}

.header-content {
    position:relative;
    z-index:1;
}

.header-icon {
    width:60px;
    height:60px;
    margin:0 auto 12px;
    border-radius:19px;
    background:rgba(255,255,255,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
}

header h2 {
    margin:0 0 9px;
    font-size:24px;
}

header p {
    margin:0;
    font-size:13px;
    opacity:.93;
    line-height:1.8;
}

.role-label {
    display:inline-block;
    margin-top:13px;
    padding:7px 15px;
    border-radius:30px;
    background:rgba(255,255,255,.16);
    font-size:12px;
}

.container {
    max-width:680px;
    margin:auto;
    padding:17px 13px;
}

/* مركز الإشعارات */

.notification-box {
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.notification-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:15px;
    cursor:pointer;
}

.notification-title {
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    font-size:15px;
}

.notification-icon {
    width:39px;
    height:39px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--green-light);
    font-size:20px;
}

.notification-count {
    min-width:23px;
    height:23px;
    padding:0 7px;
    border-radius:20px;
    background:#e53935;
    color:white;
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.notification-count.zero {
    background:#e9efeb;
    color:#75847b;
}

.notification-actions {
    display:flex;
    align-items:center;
    gap:7px;
}

.small-button {
    border:none;
    border-radius:9px;
    padding:8px 10px;
    font-size:11px;
    background:#e8f5ee;
    color:var(--green);
    cursor:pointer;
}

.notification-list {
    border-top:1px solid var(--border);
    display:none;
}

.notification-list.open {
    display:block;
    animation:appear .25s ease;
}

.notification-item {
    padding:13px 15px;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:11px;
    align-items:flex-start;
    cursor:pointer;
    transition:background .2s;
}

.notification-item:last-child {
    border-bottom:none;
}

.notification-item:active {
    background:#f1f8f4;
}

.notification-item.unread {
    background:#f0faf4;
}

.notification-item-icon {
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:12px;
    background:#e8f5ee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.notification-content {
    flex:1;
    min-width:0;
}

.notification-content strong {
    display:block;
    font-size:13px;
    margin-bottom:5px;
}

.notification-content p {
    margin:0;
    color:var(--muted);
    font-size:12px;
    line-height:1.8;
    overflow-wrap:anywhere;
}

.notification-time {
    display:block;
    font-size:10px;
    color:#9aa59e;
    margin-top:5px;
}

.empty-notifications {
    padding:20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

/* التنبيه المؤقت */

.toast {
    position:fixed;
    z-index:9999;
    top:15px;
    left:12px;
    right:12px;
    max-width:500px;
    margin:auto;
    padding:15px;
    background:#173d30;
    color:white;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    display:none;
    animation:appear .3s ease;
    line-height:1.8;
    font-size:13px;
}

.toast.show {
    display:block;
}

/* العناوين والرسائل */

.section-heading {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:8px 2px 15px;
}

.section-heading h3 {
    margin:0;
    font-size:17px;
}

.orders-count {
    background:var(--green-light);
    color:var(--green);
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.message {
    background:white;
    padding:25px 16px;
    border-radius:18px;
    text-align:center;
    margin:20px 0;
    color:var(--muted);
    box-shadow:var(--shadow);
    line-height:1.9;
    border:1px solid var(--border);
}

.message-icon {
    font-size:38px;
    display:block;
    margin-bottom:10px;
}

.message-text {
    font-size:14px;
    overflow-wrap:anywhere;
}

.hidden {
    display:none !important;
}

.loading-dot {
    display:inline-block;
    width:7px;
    height:7px;
    margin:0 3px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1s infinite alternate;
}

.loading-dot:nth-child(2) {
    animation-delay:.2s;
}

.loading-dot:nth-child(3) {
    animation-delay:.4s;
}

button {
    border:none;
    border-radius:12px;
    padding:12px 20px;
    background:var(--green);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;
    transition:transform .2s,background .2s;
}

button:active {
    transform:scale(.96);
}

/* بطاقة الطلب */

.order-card {
    background:white;
    border-radius:19px;
    padding:16px;
    margin-bottom:17px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    animation:appear .35s ease both;
    scroll-margin-top:15px;
}

.order-card.highlight {
    border:2px solid var(--green);
    box-shadow:0 0 0 5px rgba(8,127,91,.09);
}

.order-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:13px;
}

.order-head h3 {
    margin:0;
    color:var(--green);
    font-size:15px;
    line-height:1.7;
    overflow-wrap:anywhere;
}

.status-badge {
    background:#e7f5ed;
    color:var(--green);
    border-radius:25px;
    padding:8px 11px;
    font-size:11px;
    font-weight:bold;
}

.status-badge.cancelled {
    background:#ffebee;
    color:#c62828;
}

.status-badge.delivered {
    background:#e3f2fd;
    color:#1565c0;
}

.status-badge.preparing {
    background:#fff4dc;
    color:#a66b00;
}

.status-badge.onway {
    background:#e7f1ff;
    color:#145da0;
}

.order-info {
    line-height:1.9;
    font-size:13px;
    margin:13px 0;
    color:var(--muted);
    overflow-wrap:anywhere;
}

.order-info p {
    margin:5px 0;
}

/* المنتجات */

.items {
    background:#f8faf9;
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px;
    margin:13px 0;
    font-size:13px;
    line-height:2;
}

.items strong {
    display:block;
    color:var(--text);
    margin-bottom:7px;
}

.item-line {
    display:flex;
    justify-content:space-between;
    gap:8px;
    border-bottom:1px dashed #e1e8e3;
    padding:5px 0;
}

.item-line:last-child {
    border-bottom:none;
}

.item-name {
    flex:1;
    overflow-wrap:anywhere;
}

.item-price {
    color:#526158;
    white-space:nowrap;
    font-weight:bold;
}

.total {
    background:linear-gradient(135deg,#eaf6ef,#f1faf4);
    color:var(--green);
    border-radius:13px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
    margin-top:12px;
    text-align:center;
}

/* التتبع */

.tracking {
    margin-top:17px;
    padding:17px 13px;
    background:#f9fbfa;
    border:1px solid var(--border);
    border-radius:14px;
}

.tracking h4 {
    margin:0 0 20px;
    font-size:14px;
}

.track-step {
    display:flex;
    align-items:flex-start;
    gap:12px;
    position:relative;
    min-height:52px;
}

.track-step:not(:last-child):after {
    content:"";
    position:absolute;
    right:10px;
    top:23px;
    height:29px;
    width:2px;
    background:#dce5df;
}

.track-step.done:not(:last-child):after {
    background:var(--green);
}

.track-dot {
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:50%;
    background:#e1e8e3;
    color:#7d8981;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    z-index:1;
}

.track-step.done .track-dot {
    background:var(--green);
    color:white;
}

.track-step.current .track-dot {
    box-shadow:0 0 0 5px rgba(8,127,91,.13);
}

.track-label {
    padding-top:3px;
    font-size:13px;
    color:#929c95;
    line-height:1.6;
}

.track-step.done .track-label {
    color:var(--green);
    font-weight:bold;
}

.track-step.current .track-label {
    color:var(--text);
    font-weight:bold;
}

.track-time {
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
    font-weight:normal;
}

.courier-note {
    background:#e8f5ee;
    color:var(--green);
    border-radius:11px;
    padding:12px;
    font-size:12px;
    line-height:1.9;
    margin-top:12px;
}

.cancel-message {
    color:#c62828;
    background:#ffebee;
    border-radius:12px;
    padding:14px;
    font-size:13px;
    margin-top:15px;
    line-height:1.8;
    text-align:center;
}

.unknown-status {
    background:#fff8e1;
    color:#8d6e00;
    padding:13px;
    border-radius:12px;
    font-size:13px;
    margin-top:14px;
    line-height:1.8;
}

.footer-note {
    text-align:center;
    color:#87948c;
    font-size:12px;
    margin:28px 0 10px;
    line-height:1.9;
}

@media(max-width:420px) {
    .order-card {
        padding:13px;
    }

    .order-head {
        align-items:flex-start;
        flex-direction:column;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,
    *:before,
    *:after {
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="header-icon">📦</div>
        <h2 id="pageTitle">طلباتي</h2>
        <p id="pageDescription">
            تابع طلباتك من المتجر حتى باب منزلك 💚
        </p>
        <div id="roleLabel" class="role-label hidden"></div>
    </div>
</header>

<div class="container">

    <!-- مركز الإشعارات -->

    <div id="notificationBox" class="notification-box hidden">

        <div class="notification-head" id="notificationToggle">

            <div class="notification-title">
                <div class="notification-icon">🔔</div>
                <span>إشعارات سِلّتي</span>
                <span id="notificationCount"
                      class="notification-count zero">0</span>
            </div>

            <div class="notification-actions">
                <button class="small-button"
                        id="markAllRead"
                        type="button">
                    قراءة الكل
                </button>

                <span id="notificationArrow">⌄</span>
            </div>

        </div>

        <div id="notificationList" class="notification-list">

            <div class="empty-notifications">
                لا توجد إشعارات حتى الآن 🌿
            </div>

        </div>

    </div>

    <div id="message" class="message">
        <span class="message-icon">⏳</span>
        <div class="message-text">جارٍ تحميل البيانات</div>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
    </div>

    <div id="sectionHeading" class="section-heading hidden">
        <h3 id="sectionTitle">الطلبات</h3>
        <span id="ordersCount" class="orders-count">0 طلب</span>
    </div>

    <div id="ordersContainer"></div>

    <div class="footer-note">
        سِلّتي | دكان حلتك أصبح أقرب إليك 🛒
        <br>
        راحتك تبدأ من هنا 💚
    </div>

</div>

<div id="toast" class="toast"></div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


// ==========================================
// عناصر الصفحة
// ==========================================

const message = document.getElementById("message");
const container = document.getElementById("ordersContainer");
const sectionHeading = document.getElementById("sectionHeading");
const sectionTitle = document.getElementById("sectionTitle");
const ordersCount = document.getElementById("ordersCount");
const pageTitle = document.getElementById("pageTitle");
const pageDescription = document.getElementById("pageDescription");
const roleLabel = document.getElementById("roleLabel");

const notificationBox =
    document.getElementById("notificationBox");

const notificationList =
    document.getElementById("notificationList");

const notificationCount =
    document.getElementById("notificationCount");

const notificationToggle =
    document.getElementById("notificationToggle");

const notificationArrow =
    document.getElementById("notificationArrow");

const markAllRead =
    document.getElementById("markAllRead");

const toast = document.getElementById("toast");

let unsubscribeOrders = null;
let currentUser = null;
let currentRole = null;
let authCheckNumber = 0;

let firstSnapshotReceived = false;

let previousOrders = new Map();

let notifications = [];

let toastTimer = null;


// ==========================================
// مراحل تتبع الطلب
// ==========================================

const steps = [
    {
        status:"جديد",
        label:"تم استلام الطلب",
        icon:"🛒"
    },
    {
        status:"قيد التجهيز",
        label:"المتجر يجهّز طلبك",
        icon:"👨‍🍳"
    },
    {
        status:"جاهز للتسليم",
        label:"الطلب جاهز للتوصيل",
        icon:"📦"
    },
    {
        status:"المندوب في الطريق",
        label:"المندوب في الطريق إليك",
        icon:"🚚"
    },
    {
        status:"تم التسليم",
        label:"تم تسليم طلبك بنجاح",
        icon:"✅"
    }
];


// ==========================================
// أسماء الأدوار
// ==========================================

const roleNames = {
    customer:"حساب زبون",
    merchant:"حساب تاجر",
    courier:"حساب مندوب",
    admin:"حساب مدير"
};


// ==========================================
// إدارة الإشعارات المحلية
// ==========================================

function notificationStorageKey() {

    return "silatiNotifications_" + currentUser.uid;
}


function loadNotifications() {

    try {

        const saved = localStorage.getItem(
            notificationStorageKey()
        );

        notifications = saved
            ? JSON.parse(saved)
            : [];

        if (!Array.isArray(notifications)) {
            notifications = [];
        }

    } catch (error) {

        notifications = [];
    }

    renderNotifications();
}


function saveNotifications() {

    try {

        // الاحتفاظ بآخر 50 إشعاراً فقط

        notifications = notifications.slice(0, 50);

        localStorage.setItem(
            notificationStorageKey(),
            JSON.stringify(notifications)
        );

    } catch (error) {

        console.warn(
            "تعذر حفظ إشعارات سِلّتي محلياً:",
            error
        );
    }

    renderNotifications();
}


// ==========================================
// إنشاء إشعار
// ==========================================

function addNotification(data) {

    const exists = notifications.some(item =>
        item.eventKey === data.eventKey
    );

    if (exists) return;

    const notification = {

        id: Date.now() + "_" +
            Math.random().toString(36).slice(2, 8),

        eventKey: data.eventKey,

        title: data.title,

        body: data.body,

        icon: data.icon || "🔔",

        orderId: data.orderId,

        date: Date.now(),

        read: false
    };

    notifications.unshift(notification);

    saveNotifications();

    showToast(
        notification.icon + " " +
        notification.title +
        "\n" +
        notification.body
    );

}


// ==========================================
// عرض التنبيه المؤقت
// ==========================================

function showToast(text) {

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 5000);

}


// ==========================================
// تنسيق وقت الإشعار
// ==========================================

function formatNotificationTime(date) {

    try {

        return new Date(date).toLocaleString("ar");

    } catch (error) {

        return "";
    }

}


// ==========================================
// عرض مركز الإشعارات
// ==========================================

function renderNotifications() {

    const unread = notifications.filter(
        item => !item.read
    ).length;

    notificationCount.textContent =
        unread.toLocaleString("ar");

    notificationCount.classList.toggle(
        "zero",
        unread === 0
    );

    notificationList.innerHTML = "";

    if (notifications.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-notifications";

        empty.textContent =
            "لا توجد إشعارات حتى الآن 🌿";

        notificationList.appendChild(empty);

        return;
    }

    notifications.forEach(item => {

        const row = document.createElement("div");

        row.className =
            "notification-item" +
            (!item.read ? " unread" : "");

        const icon = document.createElement("div");

        icon.className = "notification-item-icon";

        icon.textContent = item.icon || "🔔";

        const content = document.createElement("div");

        content.className = "notification-content";

        const title = document.createElement("strong");

        title.textContent = item.title;

        const body = document.createElement("p");

        body.textContent = item.body;

        const time = document.createElement("span");

        time.className = "notification-time";

        time.textContent =
            formatNotificationTime(item.date);

        content.append(title, body, time);

        row.append(icon, content);

        row.addEventListener("click", () => {

            item.read = true;

            saveNotifications();

            notificationList.classList.remove("open");

            notificationArrow.textContent = "⌄";

            if (item.orderId) {

                const target = document.querySelector(
                    '[data-order-id="' + item.orderId + '"]'
                );

                if (target) {

                    target.scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                    target.classList.add("highlight");

                    setTimeout(() => {
                        target.classList.remove("highlight");
                    }, 3000);
                }
            }

        });

        notificationList.appendChild(row);

    });

}


// ==========================================
// فتح وإغلاق مركز الإشعارات
// ==========================================

notificationToggle.addEventListener("click", event => {

    if (event.target.closest("button")) return;

    notificationList.classList.toggle("open");

    notificationArrow.textContent =
        notificationList.classList.contains("open")
            ? "⌃"
            : "⌄";

});


// ==========================================
// قراءة جميع الإشعارات
// ==========================================

markAllRead.addEventListener("click", event => {

    event.stopPropagation();

    notifications.forEach(item => {
        item.read = true;
    });

    saveNotifications();

});


// ==========================================
// تحليل التغيرات وإنشاء الإشعارات
// ==========================================

function processOrderChanges(snapshot) {

    const currentOrders = new Map();

    snapshot.docs.forEach(documentSnapshot => {

        const order = documentSnapshot.data();

        const orderId = documentSnapshot.id;

        const currentStatus =
            normalizeStatus(order.status);

        currentOrders.set(orderId, {
            ...order,
            id:orderId
        });

        const previous = previousOrders.get(orderId);

        // أول تحميل: تسجيل الحالة دون إرسال إشعارات قديمة

        if (!firstSnapshotReceived) {
            return;
        }

        // طلب جديد ظهر بعد التحميل الأول

        if (!previous) {

            if (
                currentRole === "merchant" ||
                currentRole === "admin"
            ) {

                addNotification({

                    eventKey:
                        "new_order_" + orderId,

                    title:"طلب جديد! 🛍️",

                    body:
                        "وصل طلب جديد من الزبون " +
                        (
                            order.customer?.name ||
                            "أحد الزبائن"
                        ) +
                        " إلى " +
                        (order.storeName || "متجرك") +
                        ".",

                    icon:"📦",

                    orderId
                });

            } else if (currentRole === "courier") {

                addNotification({

                    eventKey:
                        "assigned_order_" + orderId,

                    title:"طلب جديد مسند إليك 🚚",

                    body:
                        "تم إسناد طلب " +
                        (order.storeName || "من أحد المتاجر") +
                        " إليك للتوصيل.",

                    icon:"🚚",

                    orderId
                });

            } else if (currentRole === "customer") {

                addNotification({

                    eventKey:
                        "customer_new_order_" + orderId,

                    title:"تم تسجيل طلبك بنجاح 🛒",

                    body:
                        "تم تسجيل طلبك من " +
                        (order.storeName || "المتجر") +
                        " بنجاح.",

                    icon:"🛒",

                    orderId
                });

            }

            return;
        }

        // تغير حالة الطلب

        const oldStatus =
            normalizeStatus(previous.status);

        if (oldStatus !== currentStatus) {

            let title = "";
            let body = "";
            let icon = "🔔";

            if (currentRole === "customer") {

                title = "تحديث طلبك";

                icon = "📦";

                body =
                    "تم تحديث طلبك من " +
                    oldStatus +
                    " إلى " +
                    currentStatus +
                    ".";

                if (currentStatus === "قيد التجهيز") {
                    icon = "👨‍🍳";
                    title = "المتجر يجهّز طلبك";
                }

                if (currentStatus === "جاهز للتسليم") {
                    icon = "📦";
                    title = "طلبك أصبح جاهزاً";
                }

                if (
                    currentStatus === "المندوب في الطريق"
                ) {
                    icon = "🚚";
                    title = "المندوب في الطريق إليك";

                    if (order.courierName) {

                        body =
                            "المندوب " +
                            order.courierName +
                            " بدأ توصيل طلبك. استعد لاستلامه.";
                    }
                }

                if (currentStatus === "تم التسليم") {
                    icon = "✅";
                    title = "تم تسليم طلبك";
                    body =
                        "تم تسليم طلبك بنجاح. شكراً لاستخدامك سِلّتي.";
                }

                if (currentStatus === "ملغي") {
                    icon = "❌";
                    title = "تم إلغاء الطلب";
                }

            } else if (currentRole === "merchant") {

                title = "تحديث حالة الطلب";
                icon = "📦";

                body =
                    "تم تحديث حالة الطلب رقم " +
                    orderId +
                    " إلى " +
                    currentStatus +
                    ".";

            } else if (currentRole === "courier") {

                title = "تحديث طلب التوصيل";
                icon = "🚚";

                body =
                    "تم تحديث حالة الطلب رقم " +
                    orderId +
                    " إلى " +
                    currentStatus +
                    ".";

                if (currentStatus === "تم التسليم") {
                    icon = "✅";
                    title = "اكتمل التوصيل";
                }

            } else if (currentRole === "admin") {

                title = "تحديث في الطلبات";
                body =
                    "تغيرت حالة الطلب رقم " +
                    orderId +
                    " إلى " +
                    currentStatus +
                    ".";
            }

            if (title) {

                addNotification({

                    eventKey:
                        "status_" +
                        orderId +
                        "_" +
                        currentStatus,

                    title,

                    body,

                    icon,

                    orderId
                });

            }

        }

        // تنبيه المندوب عند إسناد طلب إليه

        if (
            currentRole === "courier" &&
            !previous.courierUid &&
            order.courierUid === currentUser.uid
        ) {

            addNotification({

                eventKey:
                    "courier_received_" + orderId,

                title:"تم إسناد الطلب إليك 🚚",

                body:
                    "أصبح الطلب رقم " +
                    orderId +
                    " ضمن طلبات التوصيل الخاصة بك.",

                icon:"🚚",

                orderId
            });

        }

    });

    previousOrders = currentOrders;

    firstSnapshotReceived = true;

}


// ==========================================
// إعداد واجهة الدور
// ==========================================

function setupRoleInterface(role) {

    currentRole = role;

    roleLabel.textContent =
        roleNames[role] || "حساب مستخدم";

    roleLabel.classList.remove("hidden");

    if (role === "customer") {

        pageTitle.textContent = "📦 طلباتي";

        pageDescription.textContent =
            "تابع طلباتك من المتجر حتى باب منزلك 💚";

        sectionTitle.textContent = "طلباتي الأخيرة";

    } else if (role === "courier") {

        pageTitle.textContent = "🚚 طلباتي للتوصيل";

        pageDescription.textContent =
            "تابع الطلبات المسندة إليك حتى إتمام التوصيل";

        sectionTitle.textContent = "الطلبات المسندة إليّ";

    } else if (role === "merchant") {

        pageTitle.textContent = "🏪 طلبات متاجري";

        pageDescription.textContent =
            "تابع طلبات زبائن متاجرك وأحدث حالاتها";

        sectionTitle.textContent = "طلبات متاجري";

    } else if (role === "admin") {

        pageTitle.textContent = "📊 جميع الطلبات";

        pageDescription.textContent =
            "متابعة طلبات تطبيق سِلّتي";

        sectionTitle.textContent = "جميع الطلبات";

    }
}


// ==========================================
// عرض الرسائل
// ==========================================

function showMessage(text, icon = "ℹ️", buttonText = null, action = null) {

    message.innerHTML = "";
    message.style.display = "block";

    const iconElement = document.createElement("span");

    iconElement.className = "message-icon";

    iconElement.textContent = icon;

    const textElement = document.createElement("div");

    textElement.className = "message-text";

    textElement.textContent = text;

    message.append(iconElement, textElement);

    if (buttonText && action) {

        const button = document.createElement("button");

        button.textContent = buttonText;

        button.onclick = action;

        message.appendChild(button);
    }

}


// ==========================================
// شاشة التحميل
// ==========================================

function showLoading() {

    message.style.display = "block";

    message.innerHTML = `
        <span class="message-icon">⏳</span>
        <div class="message-text">جارٍ تحميل الطلبات...</div>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
    `;
}


// ==========================================
// توحيد أسماء الحالات
// ==========================================

function normalizeStatus(status) {

    const aliases = {

        "في الطريق":"المندوب في الطريق",
        "جاري التوصيل":"المندوب في الطريق",
        "قيد التوصيل":"المندوب في الطريق",
        "تم التوصيل":"تم التسليم",
        "مكتمل":"تم التسليم",
        "تم التسليم بنجاح":"تم التسليم"

    };

    status = String(status || "جديد").trim();

    return aliases[status] || status;
}


// ==========================================
// تنسيق التاريخ
// ==========================================

function formatDate(order) {

    try {

        if (
            order.createdAt &&
            typeof order.createdAt.toDate === "function"
        ) {
            return order.createdAt.toDate().toLocaleString("ar");
        }

        if (order.date) {
            return order.date;
        }

        return "غير محدد";

    } catch (error) {

        return "غير محدد";
    }
}


// ==========================================
// استخراج وقت الطلب
// ==========================================

function getOrderTime(order) {

    if (
        order.createdAt &&
        typeof order.createdAt.toMillis === "function"
    ) {
        return order.createdAt.toMillis();
    }

    if (order.date) {

        const parsed = new Date(order.date).getTime();

        if (!isNaN(parsed)) {
            return parsed;
        }
    }

    return 0;
}


// ==========================================
// حساب إجمالي المنتجات
// ==========================================

function calculateItemsTotal(items) {

    if (!Array.isArray(items)) {
        return 0;
    }

    return items.reduce((sum, item) => {

        const price = Number(item.price) || 0;

        const quantity = Number(item.quantity) || 1;

        return sum + (price * quantity);

    }, 0);
}


// ==========================================
// إنشاء شريط تتبع الطلب
// ==========================================

function createTracking(status, order) {

    status = normalizeStatus(status);

    if (status === "ملغي") {

        const cancel = document.createElement("div");

        cancel.className = "cancel-message";

        cancel.textContent = "❌ تم إلغاء هذا الطلب.";

        return cancel;
    }

    const currentIndex = steps.findIndex(
        step => step.status === status
    );

    if (currentIndex < 0) {

        const unknown = document.createElement("div");

        unknown.className = "unknown-status";

        unknown.textContent =
            "حالة الطلب الحالية: " + status +
            ". ستظهر مراحل التتبع عند تحديث الحالة.";

        return unknown;
    }

    const tracking = document.createElement("div");

    tracking.className = "tracking";

    const title = document.createElement("h4");

    title.textContent = "🚚 رحلة طلبك";

    tracking.appendChild(title);

    steps.forEach((step, index) => {

        const done = index <= currentIndex;

        const current = index === currentIndex;

        const row = document.createElement("div");

        row.className =
            "track-step" +
            (done ? " done" : "") +
            (current ? " current" : "");

        const dot = document.createElement("div");

        dot.className = "track-dot";

        dot.textContent = done ? "✓" : "";

        const label = document.createElement("div");

        label.className = "track-label";

        label.textContent =
            step.icon + " " + step.label;

        if (current) {

            const currentText = document.createElement("span");

            currentText.className = "track-time";

            currentText.textContent = "أنت هنا الآن";

            label.appendChild(currentText);
        }

        row.append(dot, label);

        tracking.appendChild(row);
    });

    if (
        order.courierUid &&
        status === "جاهز للتسليم"
    ) {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🚚 تم إسناد طلبك إلى المندوب" +
            (order.courierName
                ? ": " + order.courierName
                : "") +
            ". سيظهر تحديث جديد عندما يبدأ المندوب التوصيل.";

        tracking.appendChild(note);
    }

    if (
        order.courierName &&
        status === "المندوب في الطريق"
    ) {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🚚 المندوب " + order.courierName +
            " في طريقه إليك. يرجى الاستعداد لاستلام طلبك.";

        tracking.appendChild(note);
    }

    if (status === "تم التسليم") {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🎉 اكتملت رحلتك! شكراً لاستخدامك سِلّتي.";

        tracking.appendChild(note);
    }

    return tracking;
}


// ==========================================
// إنشاء بطاقة الطلب
// ==========================================

function renderOrder(order, index) {

    const status = normalizeStatus(order.status);

    const card = document.createElement("div");

    card.className = "order-card";

    card.dataset.orderId = order.id;

    card.style.animationDelay =
        (index * 0.05) + "s";

    const head = document.createElement("div");

    head.className = "order-head";

    const title = document.createElement("h3");

    title.textContent =
        "🏪 " + (order.storeName || "متجر سِلّتي");

    const badge = document.createElement("span");

    badge.className = "status-badge";

    badge.textContent = status;

    if (status === "ملغي") {

        badge.classList.add("cancelled");

    } else if (status === "تم التسليم") {

        badge.classList.add("delivered");

    } else if (status === "قيد التجهيز") {

        badge.classList.add("preparing");

    } else if (status === "المندوب في الطريق") {

        badge.classList.add("onway");
    }

    head.append(title, badge);

    const info = document.createElement("div");

    info.className = "order-info";

    const id = document.createElement("p");

    id.textContent =
        "🔢 رقم الطلب: " + order.id;

    const date = document.createElement("p");

    date.textContent =
        "📅 تاريخ الطلب: " + formatDate(order);

    info.append(id, date);

    if (
        currentRole === "customer" &&
        order.courierName
    ) {

        const courier = document.createElement("p");

        courier.textContent =
            "🚚 المندوب: " + order.courierName;

        info.appendChild(courier);
    }

    const itemsBox = document.createElement("div");

    itemsBox.className = "items";

    const itemsTitle = document.createElement("strong");

    itemsTitle.textContent = "🛍️ المنتجات";

    itemsBox.appendChild(itemsTitle);

    if (
        Array.isArray(order.items) &&
        order.items.length > 0
    ) {

        order.items.forEach(item => {

            const line = document.createElement("div");

            line.className = "item-line";

            const name = document.createElement("span");

            name.className = "item-name";

            const quantity = Number(item.quantity) || 1;

            name.textContent =
                (item.name || "منتج") + " × " + quantity;

            const price = document.createElement("span");

            price.className = "item-price";

            price.textContent =
                (
                    (Number(item.price) || 0) * quantity
                ).toLocaleString("ar") + " جنيه";

            line.append(name, price);

            itemsBox.appendChild(line);
        });

    } else {

        const emptyItems = document.createElement("div");

        emptyItems.textContent =
            "لا توجد تفاصيل للمنتجات.";

        itemsBox.appendChild(emptyItems);
    }

    const total = document.createElement("div");

    total.className = "total";

    const orderTotal =
        order.total !== undefined &&
        order.total !== null
            ? Number(order.total) || 0
            : calculateItemsTotal(order.items);

    total.textContent =
        "الإجمالي: " +
        orderTotal.toLocaleString("ar") +
        " جنيه";

    const tracking = createTracking(status, order);

    card.append(
        head,
        info,
        itemsBox,
        total,
        tracking
    );

    container.appendChild(card);
}


// ==========================================
// عرض الطلبات
// ==========================================

function showOrders(snapshot) {

    container.innerHTML = "";

    sectionHeading.classList.remove("hidden");

    const orders = snapshot.docs.map(documentSnapshot => ({
        ...documentSnapshot.data(),
        id: documentSnapshot.id
    }));

    orders.sort((a, b) => {
        return getOrderTime(b) - getOrderTime(a);
    });

    ordersCount.textContent =
        orders.length.toLocaleString("ar") + " طلب";

    if (orders.length === 0) {

        let emptyText = "لا توجد طلبات حتى الآن.";

        if (currentRole === "courier") {

            emptyText =
                "لا توجد طلبات مسندة إليك حالياً.";

        } else if (currentRole === "merchant") {

            emptyText =
                "لا توجد طلبات على متاجرك حتى الآن.";

        } else if (currentRole === "admin") {

            emptyText =
                "لا توجد طلبات مسجلة في التطبيق حتى الآن.";
        }

        showMessage(emptyText, "🛒");

        return;
    }

    message.style.display = "none";

    orders.forEach((order, index) => {
        renderOrder(order, index);
    });
}


// ==========================================
// معالجة أخطاء Firestore
// ==========================================

function handleOrdersError(error) {

    console.error("Silati Orders Error:", error);

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");

    let errorText =
        "تعذر تحميل الطلبات. تحقق من الاتصال بالإنترنت.";

    if (
        error.code === "permission-denied" ||
        error.code === "unauthenticated"
    ) {

        errorText =
            "ليس لديك صلاحية قراءة هذه الطلبات. يرجى مراجعة صلاحيات حسابك في Firebase.";

    } else if (error.code === "unavailable") {

        errorText =
            "خدمة Firebase غير متاحة حالياً. تحقق من الإنترنت وحاول مجدداً.";
    }

    showMessage(
        errorText,
        "⚠️",
        "إعادة المحاولة",
        () => {
            if (currentUser) {
                loadOrdersForUser(
                    currentUser,
                    authCheckNumber
                );
            }
        }
    );
}


// ==========================================
// إيقاف مراقبة الطلبات
// ==========================================

function stopOrdersListener() {

    if (unsubscribeOrders) {

        unsubscribeOrders();

        unsubscribeOrders = null;
    }

}


// ==========================================
// تحميل الطلبات حسب نوع المستخدم
// ==========================================

async function loadOrdersForUser(user, checkNumber) {

    if (!user) return;

    stopOrdersListener();

    firstSnapshotReceived = false;

    previousOrders = new Map();

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");

    showLoading();

    try {

        const userRef = doc(db, "users", user.uid);

        const userSnapshot = await getDoc(userRef);

        if (checkNumber !== authCheckNumber) return;

        if (!userSnapshot.exists()) {

            showMessage(
                "لم يتم العثور على بيانات حسابك. يرجى التواصل مع الإدارة.",
                "⚠️"
            );

            return;
        }

        const userData = userSnapshot.data();

        const role = userData.role;

        const allowedRoles = [
            "customer",
            "merchant",
            "courier",
            "admin"
        ];

        if (!allowedRoles.includes(role)) {

            showMessage(
                "نوع الحساب غير معروف. يرجى مراجعة الإدارة.",
                "⚠️"
            );

            return;
        }

        setupRoleInterface(role);

        notificationBox.classList.remove("hidden");

        loadNotifications();

        let ordersQuery;

        if (role === "customer") {

            ordersQuery = query(
                collection(db, "orders"),
                where("customerId", "==", user.uid)
            );

        } else if (role === "courier") {

            ordersQuery = query(
                collection(db, "orders"),
                where("courierUid", "==", user.uid)
            );

        } else if (role === "merchant") {

            ordersQuery = query(
                collection(db, "orders"),
                where("ownerUid", "==", user.uid)
            );

        } else if (role === "admin") {

            ordersQuery = query(
                collection(db, "orders")
            );
        }

        unsubscribeOrders = onSnapshot(

            ordersQuery,

            snapshot => {

                if (checkNumber !== authCheckNumber) return;

                processOrderChanges(snapshot);

                showOrders(snapshot);
            },

            error => {

                if (checkNumber !== authCheckNumber) return;

                handleOrdersError(error);
            }
        );

    } catch (error) {

        console.error("Load Orders Error:", error);

        if (checkNumber !== authCheckNumber) return;

        handleOrdersError(error);
    }
}


// ==========================================
// متابعة تسجيل الدخول
// ==========================================

onAuthStateChanged(auth, async user => {

    const checkNumber = ++authCheckNumber;

    stopOrdersListener();

    currentUser = user;

    currentRole = null;

    previousOrders = new Map();

    firstSnapshotReceived = false;

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");

    notificationBox.classList.add("hidden");

    notifications = [];

    renderNotifications();

    if (!user) {

        roleLabel.classList.add("hidden");

        pageTitle.textContent = "📦 طلباتي";

        pageDescription.textContent =
            "سجل دخولك لمتابعة طلباتك";

        showMessage(
            "يرجى تسجيل الدخول أولاً لعرض الطلبات.",
            "🔐",
            "تسجيل الدخول",
            () => {
                location.href = "login.html";
            }
        );

        return;
    }

    await loadOrdersForUser(user, checkNumber);

});
