<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلباتي | سِلّتي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f3;
    color: #26332e;
}

header {
    background: #087f5b;
    color: white;
    padding: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 750px;
    margin: 20px auto;
    padding: 15px;
}

h2 {
    color: #087f5b;
}

.order-card {
    background: white;
    padding: 17px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000012;
}

.order-card h3 {
    color: #087f5b;
}

.status {
    padding: 9px;
    border-radius: 7px;
    background: #e8f5e9;
    color: #087f5b;
    font-weight: bold;
    display: inline-block;
}

.items {
    background: #f5f7f6;
    padding: 12px;
    border-radius: 8px;
    margin: 12px 0;
}

.total {
    font-size: 19px;
    font-weight: bold;
    color: #087f5b;
}

.message {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    margin-top: 20px;
}

button {
    background: #087f5b;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.back {
    display: block;
    text-align: center;
    margin: 25px;
    color: #087f5b;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <strong>🛒 سِلّتي</strong>
    <a href="index.html">الرئيسية</a>
</header>

<div class="container">

    <h2>📦 طلباتي</h2>

    <p>تابع طلباتك وحالة تجهيزها من المتاجر.</p>

    <div id="ordersList" class="message">
        جاري تحميل طلباتك...
    </div>

    <a href="stores.html" class="back">
        العودة إلى المتاجر
    </a>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const ordersList = document.getElementById("ordersList");

let stopListening = null;


function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}


function renderOrders(orders) {

    if (orders.length === 0) {

        ordersList.className = "message";

        ordersList.innerHTML =
            "لا توجد طلبات مسجلة في حسابك حالياً.";

        return;
    }

    ordersList.className = "";

    ordersList.innerHTML = orders.map(order => {

        const customer = order.customer || {};

        const items = Array.isArray(order.items)
            ? order.items
            : [];

        const itemsHTML = items.map(item => `
            <div>
                ${escapeHTML(item.name)}
                × ${escapeHTML(item.quantity)}
                <br>
                السعر: ${Number(item.price || 0).toLocaleString("ar")} جنيه
            </div>
            <hr>
        `).join("");

        return `

        <div class="order-card">

            <h3>🏪 ${escapeHTML(order.storeName || "متجر")}</h3>

            <p>
                رقم الطلب:
                ${escapeHTML(order.id)}
            </p>

            <div class="status">
                الحالة: ${escapeHTML(order.status || "جديد")}
            </div>

            <div class="items">

                <strong>المنتجات:</strong>

                ${itemsHTML}

            </div>

            <p class="total">
                الإجمالي:
                ${Number(order.total || 0).toLocaleString("ar")}
                جنيه
            </p>

            <p>
                تاريخ الطلب:
                ${escapeHTML(order.date || "غير محدد")}
            </p>

        </div>

        `;

    }).join("");

}


onAuthStateChanged(auth, user => {

    if (stopListening) {
        stopListening();
        stopListening = null;
    }

    if (!user) {

        ordersList.className = "message";

        ordersList.innerHTML = `
            يجب تسجيل الدخول لمشاهدة طلباتك.
            <br><br>
            <button onclick="location.href='login.html'">
                تسجيل الدخول
            </button>
        `;

        return;
    }

    ordersList.className = "message";
    ordersList.textContent = "جاري تحميل طلباتك...";

    const ordersQuery = query(
        collection(db, "orders"),
        where("customerId", "==", user.uid)
    );

    stopListening = onSnapshot(
        ordersQuery,

        snapshot => {

            const orders = snapshot.docs.map(doc => doc.data());

            orders.sort((a, b) =>
                String(b.date || "").localeCompare(String(a.date || ""))
            );

            renderOrders(orders);

        },

        error => {

            console.error(error);

            ordersList.className = "message";

            ordersList.textContent =
                "تعذر تحميل الطلبات. تحقق من اتصال الإنترنت وصلاحيات قاعدة البيانات.";

        }
    );

});

</script>
<script src="bottom-nav.js" defer></script>
</body>
</html>
