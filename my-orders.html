<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>طلباتي | سِلّتي</title>

<style>
:root {
    --green:#087f5b;
    --green-dark:#075b43;
    --green-light:#e8f5ee;
    --bg:#f1f5f3;
    --text:#26332d;
    --muted:#75847b;
    --border:#e9efeb;
    --shadow:0 7px 24px rgba(24,65,45,.07);
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

@view-transition {
    navigation:auto;
}

::view-transition-old(root) {
    animation:pageOut .2s ease both;
}

::view-transition-new(root) {
    animation:pageIn .35s ease both;
}

@keyframes pageIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
}

@keyframes pageOut {
    to { opacity:0; }
}

@keyframes appear {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
}

@keyframes pulse {
    from { opacity:.25; transform:translateY(0); }
    to { opacity:1; transform:translateY(-4px); }
}

body {
    margin:0;
    padding:0 0 100px;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    animation:pageIn .4s ease;
}

/* رأس الصفحة */

header {
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:white;
    padding:30px 18px 35px;
    text-align:center;
    border-radius:0 0 27px 27px;
    box-shadow:0 7px 22px rgba(0,0,0,.13);
}

header:before,
header:after {
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

header:before {
    width:180px;
    height:180px;
    top:-90px;
    right:-45px;
}

header:after {
    width:120px;
    height:120px;
    bottom:-75px;
    left:-25px;
}

.header-content {
    position:relative;
    z-index:1;
}

.header-icon {
    width:62px;
    height:62px;
    margin:0 auto 12px;
    border-radius:20px;
    background:rgba(255,255,255,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    backdrop-filter:blur(5px);
}

header h2 {
    margin:0 0 9px;
    font-size:25px;
}

header p {
    margin:0;
    font-size:13px;
    opacity:.93;
    line-height:1.8;
}

.role-label {
    display:inline-block;
    margin-top:13px;
    padding:7px 15px;
    border-radius:30px;
    background:rgba(255,255,255,.16);
    font-size:12px;
}

/* المحتوى */

.container {
    max-width:680px;
    margin:auto;
    padding:18px 14px;
}

.section-heading {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:5px 2px 15px;
}

.section-heading h3 {
    margin:0;
    font-size:17px;
}

.orders-count {
    background:var(--green-light);
    color:var(--green);
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* الرسائل */

.message {
    background:white;
    padding:25px 16px;
    border-radius:18px;
    text-align:center;
    margin:20px 0;
    color:var(--muted);
    box-shadow:var(--shadow);
    line-height:1.9;
    border:1px solid var(--border);
    animation:appear .35s ease;
}

.message-icon {
    font-size:38px;
    display:block;
    margin-bottom:10px;
}

.message-text {
    font-size:14px;
    overflow-wrap:anywhere;
}

.message button {
    display:block;
    margin:16px auto 0;
}

.hidden {
    display:none !important;
}

.loading-dot {
    display:inline-block;
    width:7px;
    height:7px;
    margin:0 3px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1s infinite alternate;
}

.loading-dot:nth-child(2) {
    animation-delay:.2s;
}

.loading-dot:nth-child(3) {
    animation-delay:.4s;
}

/* الأزرار */

button {
    border:none;
    border-radius:12px;
    padding:12px 21px;
    background:var(--green);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    transition:transform .2s,background .2s,box-shadow .2s;
}

button:active {
    transform:scale(.96);
}

button:hover {
    background:var(--green-dark);
    box-shadow:0 5px 12px rgba(8,127,91,.15);
}

/* بطاقة الطلب */

.order-card {
    background:white;
    border-radius:19px;
    padding:17px;
    margin-bottom:17px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    animation:appear .4s ease both;
    transition:transform .25s,box-shadow .25s;
}

.order-card:active {
    transform:scale(.99);
}

.order-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:14px;
}

.order-head h3 {
    margin:0;
    color:var(--green);
    font-size:15px;
    line-height:1.7;
    overflow-wrap:anywhere;
}

.status-badge {
    background:#e7f5ed;
    color:var(--green);
    border-radius:25px;
    padding:8px 11px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status-badge.cancelled {
    background:#ffebee;
    color:#c62828;
}

.status-badge.delivered {
    background:#e3f2fd;
    color:#1565c0;
}

.status-badge.preparing {
    background:#fff4dc;
    color:#a66b00;
}

.status-badge.onway {
    background:#e7f1ff;
    color:#145da0;
}

/* معلومات الطلب */

.order-info {
    line-height:1.9;
    font-size:13px;
    margin:13px 0;
    color:var(--muted);
    overflow-wrap:anywhere;
}

.order-info p {
    margin:5px 0;
}

/* المنتجات */

.items {
    background:#f8faf9;
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px;
    margin:13px 0;
    font-size:13px;
    line-height:2;
}

.items strong {
    display:block;
    color:var(--text);
    margin-bottom:7px;
}

.item-line {
    display:flex;
    justify-content:space-between;
    gap:8px;
    border-bottom:1px dashed #e1e8e3;
    padding:5px 0;
}

.item-line:last-child {
    border-bottom:none;
}

.item-name {
    flex:1;
    overflow-wrap:anywhere;
}

.item-price {
    color:#526158;
    white-space:nowrap;
    font-weight:bold;
}

/* الإجمالي */

.total {
    background:linear-gradient(135deg,#eaf6ef,#f1faf4);
    color:var(--green);
    border-radius:13px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
    margin-top:12px;
    text-align:center;
}

/* شريط التتبع */

.tracking {
    margin-top:17px;
    padding:17px 13px;
    background:#f9fbfa;
    border:1px solid var(--border);
    border-radius:14px;
}

.tracking h4 {
    margin:0 0 20px;
    color:var(--text);
    font-size:14px;
}

.track-step {
    display:flex;
    align-items:flex-start;
    gap:12px;
    position:relative;
    min-height:52px;
}

.track-step:not(:last-child):after {
    content:"";
    position:absolute;
    right:10px;
    top:23px;
    height:29px;
    width:2px;
    background:#dce5df;
    transition:background .3s ease;
}

.track-step.done:not(:last-child):after {
    background:var(--green);
}

.track-dot {
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:50%;
    background:#e1e8e3;
    color:#7d8981;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    z-index:1;
    transition:all .3s ease;
}

.track-step.done .track-dot {
    background:var(--green);
    color:white;
    box-shadow:0 0 0 4px rgba(8,127,91,.08);
}

.track-step.current .track-dot {
    box-shadow:0 0 0 5px rgba(8,127,91,.13);
    transform:scale(1.08);
}

.track-label {
    padding-top:3px;
    font-size:13px;
    color:#929c95;
    line-height:1.6;
}

.track-step.done .track-label {
    color:var(--green);
    font-weight:bold;
}

.track-step.current .track-label {
    color:var(--text);
    font-weight:bold;
}

.track-time {
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:normal;
    margin-top:3px;
}

/* المندوب */

.courier-note {
    background:#e8f5ee;
    color:var(--green);
    border-radius:11px;
    padding:12px;
    font-size:12px;
    line-height:1.9;
    margin-top:12px;
    overflow-wrap:anywhere;
}

/* الحالات الخاصة */

.cancel-message {
    color:#c62828;
    background:#ffebee;
    border-radius:12px;
    padding:14px;
    font-size:13px;
    margin-top:15px;
    line-height:1.8;
    text-align:center;
}

.unknown-status {
    background:#fff8e1;
    color:#8d6e00;
    padding:13px;
    border-radius:12px;
    font-size:13px;
    margin-top:14px;
    line-height:1.8;
}

/* التذييل */

.footer-note {
    text-align:center;
    color:#87948c;
    font-size:12px;
    margin:28px 0 10px;
    line-height:1.9;
}

@media(max-width:420px) {
    .container {
        padding:15px 10px;
    }

    .order-card {
        padding:14px;
    }

    .order-head {
        align-items:flex-start;
        flex-direction:column;
    }

    .status-badge {
        white-space:normal;
    }

    .item-line {
        font-size:12px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,
    *:before,
    *:after {
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="header-icon">📦</div>
        <h2 id="pageTitle">طلباتي</h2>
        <p id="pageDescription">
            تابع طلباتك من المتجر حتى باب منزلك 💚
        </p>
        <div id="roleLabel" class="role-label hidden"></div>
    </div>
</header>

<div class="container">

    <div id="message" class="message">
        <span class="message-icon">⏳</span>
        <div class="message-text">جارٍ تحميل البيانات</div>
        <div>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        </div>
    </div>

    <div id="sectionHeading" class="section-heading hidden">
        <h3 id="sectionTitle">الطلبات</h3>
        <span id="ordersCount" class="orders-count">0 طلب</span>
    </div>

    <div id="ordersContainer"></div>

    <div class="footer-note">
        سِلّتي | دكان حلتك أصبح أقرب إليك 🛒
        <br>
        راحتك تبدأ من هنا 💚
    </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


// ==========================================
// عناصر الصفحة
// ==========================================

const message = document.getElementById("message");
const container = document.getElementById("ordersContainer");
const sectionHeading = document.getElementById("sectionHeading");
const sectionTitle = document.getElementById("sectionTitle");
const ordersCount = document.getElementById("ordersCount");
const pageTitle = document.getElementById("pageTitle");
const pageDescription = document.getElementById("pageDescription");
const roleLabel = document.getElementById("roleLabel");

let unsubscribeOrders = null;
let currentUser = null;
let currentRole = null;
let authCheckNumber = 0;


// ==========================================
// مراحل تتبع الطلب
// ==========================================

const steps = [
    {
        status:"جديد",
        label:"تم استلام الطلب",
        icon:"🛒"
    },
    {
        status:"قيد التجهيز",
        label:"المتجر يجهّز طلبك",
        icon:"👨‍🍳"
    },
    {
        status:"جاهز للتسليم",
        label:"الطلب جاهز للتوصيل",
        icon:"📦"
    },
    {
        status:"المندوب في الطريق",
        label:"المندوب في الطريق إليك",
        icon:"🚚"
    },
    {
        status:"تم التسليم",
        label:"تم تسليم طلبك بنجاح",
        icon:"✅"
    }
];


// ==========================================
// أسماء الأدوار
// ==========================================

const roleNames = {
    customer:"حساب زبون",
    merchant:"حساب تاجر",
    courier:"حساب مندوب",
    admin:"حساب مدير"
};


// ==========================================
// إعداد واجهة الدور
// ==========================================

function setupRoleInterface(role) {

    currentRole = role;

    roleLabel.textContent =
        roleNames[role] || "حساب مستخدم";

    roleLabel.classList.remove("hidden");

    if (role === "customer") {

        pageTitle.textContent = "📦 طلباتي";

        pageDescription.textContent =
            "تابع طلباتك من المتجر حتى باب منزلك 💚";

        sectionTitle.textContent = "طلباتي الأخيرة";

    } else if (role === "courier") {

        pageTitle.textContent = "🚚 طلباتي للتوصيل";

        pageDescription.textContent =
            "تابع الطلبات المسندة إليك حتى إتمام التوصيل";

        sectionTitle.textContent = "الطلبات المسندة إليّ";

    } else if (role === "merchant") {

        pageTitle.textContent = "🏪 طلبات متاجري";

        pageDescription.textContent =
            "تابع طلبات زبائن متاجرك وأحدث حالاتها";

        sectionTitle.textContent = "طلبات متاجري";

    } else if (role === "admin") {

        pageTitle.textContent = "📊 جميع الطلبات";

        pageDescription.textContent =
            "متابعة طلبات تطبيق سِلّتي";

        sectionTitle.textContent = "جميع الطلبات";

    }
}


// ==========================================
// عرض الرسائل
// ==========================================

function showMessage(text, icon = "ℹ️", buttonText = null, action = null) {

    message.innerHTML = "";
    message.style.display = "block";

    const iconElement = document.createElement("span");
    iconElement.className = "message-icon";
    iconElement.textContent = icon;

    const textElement = document.createElement("div");
    textElement.className = "message-text";
    textElement.textContent = text;

    message.append(iconElement, textElement);

    if (buttonText && action) {

        const button = document.createElement("button");
        button.textContent = buttonText;
        button.onclick = action;

        message.appendChild(button);
    }
}


// ==========================================
// شاشة التحميل
// ==========================================

function showLoading() {

    message.style.display = "block";

    message.innerHTML = `
        <span class="message-icon">⏳</span>
        <div class="message-text">جارٍ تحميل الطلبات...</div>
        <div>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        </div>
    `;
}


// ==========================================
// توحيد أسماء الحالات
// ==========================================

function normalizeStatus(status) {

    const aliases = {

        "في الطريق":"المندوب في الطريق",
        "جاري التوصيل":"المندوب في الطريق",
        "قيد التوصيل":"المندوب في الطريق",
        "تم التوصيل":"تم التسليم",
        "مكتمل":"تم التسليم",
        "تم التسليم بنجاح":"تم التسليم"

    };

    status = String(status || "جديد").trim();

    return aliases[status] || status;
}


// ==========================================
// تنسيق التاريخ
// ==========================================

function formatDate(order) {

    try {

        if (
            order.createdAt &&
            typeof order.createdAt.toDate === "function"
        ) {
            return order.createdAt.toDate().toLocaleString("ar");
        }

        if (order.date) {
            return order.date;
        }

        return "غير محدد";

    } catch (error) {

        return "غير محدد";
    }
}


// ==========================================
// استخراج وقت الطلب
// ==========================================

function getOrderTime(order) {

    if (
        order.createdAt &&
        typeof order.createdAt.toMillis === "function"
    ) {
        return order.createdAt.toMillis();
    }

    if (order.date) {

        const parsed = new Date(order.date).getTime();

        if (!isNaN(parsed)) {
            return parsed;
        }
    }

    return 0;
}


// ==========================================
// حساب إجمالي المنتجات
// ==========================================

function calculateItemsTotal(items) {

    if (!Array.isArray(items)) {
        return 0;
    }

    return items.reduce((sum, item) => {

        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;

        return sum + (price * quantity);

    }, 0);
}


// ==========================================
// إنشاء شريط تتبع الطلب
// ==========================================

function createTracking(status, order) {

    status = normalizeStatus(status);

    if (status === "ملغي") {

        const cancel = document.createElement("div");
        cancel.className = "cancel-message";
        cancel.textContent = "❌ تم إلغاء هذا الطلب.";

        return cancel;
    }

    const currentIndex = steps.findIndex(
        step => step.status === status
    );

    if (currentIndex < 0) {

        const unknown = document.createElement("div");

        unknown.className = "unknown-status";

        unknown.textContent =
            "حالة الطلب الحالية: " + status +
            ". ستظهر مراحل التتبع عند تحديث الحالة.";

        return unknown;
    }

    const tracking = document.createElement("div");
    tracking.className = "tracking";

    const title = document.createElement("h4");
    title.textContent = "🚚 رحلة طلبك";

    tracking.appendChild(title);


    steps.forEach((step, index) => {

        const done = index <= currentIndex;
        const current = index === currentIndex;

        const row = document.createElement("div");

        row.className =
            "track-step" +
            (done ? " done" : "") +
            (current ? " current" : "");

        const dot = document.createElement("div");

        dot.className = "track-dot";
        dot.textContent = done ? "✓" : "";

        const label = document.createElement("div");

        label.className = "track-label";

        label.textContent =
            step.icon + " " + step.label;

        if (current) {

            const currentText = document.createElement("span");

            currentText.className = "track-time";

            currentText.textContent = "أنت هنا الآن";

            label.appendChild(currentText);
        }

        row.append(dot, label);

        tracking.appendChild(row);
    });


    // توضيح استلام المندوب للطلب
    // الاستلام وحده لا يعني أنه بدأ الطريق

    if (
        order.courierUid &&
        status === "جاهز للتسليم"
    ) {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🚚 تم إسناد طلبك إلى المندوب" +
            (order.courierName
                ? ": " + order.courierName
                : "") +
            ". سيظهر تحديث جديد عندما يبدأ المندوب التوصيل.";

        tracking.appendChild(note);
    }


    // إظهار اسم المندوب أثناء الطريق

    if (
        order.courierName &&
        status === "المندوب في الطريق"
    ) {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🚚 المندوب " + order.courierName +
            " في طريقه إليك. يرجى الاستعداد لاستلام طلبك.";

        tracking.appendChild(note);
    }


    // رسالة إتمام الطلب

    if (status === "تم التسليم") {

        const note = document.createElement("div");

        note.className = "courier-note";

        note.textContent =
            "🎉 اكتملت رحلتك! شكراً لاستخدامك سِلّتي.";

        tracking.appendChild(note);
    }

    return tracking;
}


// ==========================================
// إنشاء بطاقة الطلب
// ==========================================

function renderOrder(order, index) {

    const status = normalizeStatus(order.status);

    const card = document.createElement("div");

    card.className = "order-card";

    card.style.animationDelay =
        (index * 0.06) + "s";


    // رأس الطلب

    const head = document.createElement("div");

    head.className = "order-head";

    const title = document.createElement("h3");

    title.textContent =
        "🏪 " + (order.storeName || "متجر سِلّتي");

    const badge = document.createElement("span");

    badge.className = "status-badge";
    badge.textContent = status;

    if (status === "ملغي") {

        badge.classList.add("cancelled");

    } else if (status === "تم التسليم") {

        badge.classList.add("delivered");

    } else if (status === "قيد التجهيز") {

        badge.classList.add("preparing");

    } else if (status === "المندوب في الطريق") {

        badge.classList.add("onway");
    }

    head.append(title, badge);


    // معلومات الطلب

    const info = document.createElement("div");

    info.className = "order-info";

    const id = document.createElement("p");

    id.textContent =
        "🔢 رقم الطلب: " + (order.id || "غير محدد");

    const date = document.createElement("p");

    date.textContent =
        "📅 تاريخ الطلب: " + formatDate(order);

    info.append(id, date);


    // اسم المندوب

    if (
        currentRole === "customer" &&
        order.courierName
    ) {

        const courier = document.createElement("p");

        courier.textContent =
            "🚚 المندوب: " + order.courierName;

        info.appendChild(courier);
    }


    // المنتجات

    const itemsBox = document.createElement("div");

    itemsBox.className = "items";

    const itemsTitle = document.createElement("strong");

    itemsTitle.textContent = "🛍️ المنتجات";

    itemsBox.appendChild(itemsTitle);


    if (
        Array.isArray(order.items) &&
        order.items.length > 0
    ) {

        order.items.forEach(item => {

            const line = document.createElement("div");

            line.className = "item-line";

            const name = document.createElement("span");

            name.className = "item-name";

            const quantity = Number(item.quantity) || 1;

            name.textContent =
                (item.name || "منتج") + " × " + quantity;

            const price = document.createElement("span");

            price.className = "item-price";

            price.textContent =
                (
                    (Number(item.price) || 0) * quantity
                ).toLocaleString("ar") + " جنيه";

            line.append(name, price);

            itemsBox.appendChild(line);
        });

    } else {

        const emptyItems = document.createElement("div");

        emptyItems.textContent =
            "لا توجد تفاصيل للمنتجات.";

        itemsBox.appendChild(emptyItems);
    }


    // الإجمالي

    const total = document.createElement("div");

    total.className = "total";

    const orderTotal =
        order.total !== undefined &&
        order.total !== null
            ? Number(order.total) || 0
            : calculateItemsTotal(order.items);

    total.textContent =
        "الإجمالي: " +
        orderTotal.toLocaleString("ar") +
        " جنيه";


    // التتبع

    const tracking = createTracking(status, order);


    card.append(
        head,
        info,
        itemsBox,
        total,
        tracking
    );

    container.appendChild(card);
}


// ==========================================
// عرض الطلبات
// ==========================================

function showOrders(snapshot) {

    container.innerHTML = "";

    sectionHeading.classList.remove("hidden");

    const orders = snapshot.docs.map(documentSnapshot => ({
        ...documentSnapshot.data(),
        id: documentSnapshot.id
    }));

    orders.sort((a, b) => {
        return getOrderTime(b) - getOrderTime(a);
    });

    ordersCount.textContent =
        orders.length.toLocaleString("ar") + " طلب";


    if (orders.length === 0) {

        let emptyText = "لا توجد طلبات حتى الآن.";

        if (currentRole === "courier") {

            emptyText =
                "لا توجد طلبات مسندة إليك حالياً. ستظهر هنا الطلبات التي تستلمها.";

        } else if (currentRole === "merchant") {

            emptyText =
                "لا توجد طلبات على متاجرك حتى الآن.";

        } else if (currentRole === "admin") {

            emptyText =
                "لا توجد طلبات مسجلة في التطبيق حتى الآن.";
        }

        showMessage(emptyText, "🛒");

        return;
    }

    message.style.display = "none";

    orders.forEach((order, index) => {
        renderOrder(order, index);
    });
}


// ==========================================
// معالجة أخطاء Firestore
// ==========================================

function handleOrdersError(error) {

    console.error("Silati Orders Error:", error);

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");

    let errorText =
        "تعذر تحميل الطلبات. تحقق من الاتصال بالإنترنت.";

    if (
        error.code === "permission-denied" ||
        error.code === "unauthenticated"
    ) {

        errorText =
            "ليس لديك صلاحية قراءة هذه الطلبات. يرجى مراجعة صلاحيات حسابك في Firebase.";

    } else if (error.code === "unavailable") {

        errorText =
            "خدمة Firebase غير متاحة حالياً. تحقق من الإنترنت وحاول مجدداً.";
    }

    showMessage(
        errorText,
        "⚠️",
        "إعادة المحاولة",
        () => {
            if (currentUser) {
                loadOrdersForUser(currentUser);
            }
        }
    );
}


// ==========================================
// إيقاف مراقبة الطلبات
// ==========================================

function stopOrdersListener() {

    if (unsubscribeOrders) {

        unsubscribeOrders();

        unsubscribeOrders = null;
    }
}


// ==========================================
// تحميل الطلبات حسب نوع المستخدم
// ==========================================

async function loadOrdersForUser(user, checkNumber) {

    if (!user) return;

    stopOrdersListener();

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");

    showLoading();

    try {

        // قراءة بيانات المستخدم

        const userRef = doc(db, "users", user.uid);

        const userSnapshot = await getDoc(userRef);

        if (checkNumber !== authCheckNumber) return;


        if (!userSnapshot.exists()) {

            showMessage(
                "لم يتم العثور على بيانات حسابك. يرجى التواصل مع الإدارة.",
                "⚠️"
            );

            return;
        }


        const userData = userSnapshot.data();

        const role = userData.role;

        const allowedRoles = [
            "customer",
            "merchant",
            "courier",
            "admin"
        ];

        if (!allowedRoles.includes(role)) {

            showMessage(
                "نوع الحساب غير معروف. يرجى مراجعة الإدارة.",
                "⚠️"
            );

            return;
        }


        setupRoleInterface(role);


        // تجهيز الاستعلام حسب الدور

        let ordersQuery;

        if (role === "customer") {

            ordersQuery = query(
                collection(db, "orders"),
                where("customerId", "==", user.uid)
            );

        } else if (role === "courier") {

            ordersQuery = query(
                collection(db, "orders"),
                where("courierUid", "==", user.uid)
            );

        } else if (role === "merchant") {

            ordersQuery = query(
                collection(db, "orders"),
                where("ownerUid", "==", user.uid)
            );

        } else if (role === "admin") {

            ordersQuery = query(
                collection(db, "orders")
            );
        }


        // مراقبة الطلبات لحظياً

        unsubscribeOrders = onSnapshot(

            ordersQuery,

            snapshot => {

                if (checkNumber !== authCheckNumber) return;

                showOrders(snapshot);
            },

            error => {

                if (checkNumber !== authCheckNumber) return;

                handleOrdersError(error);
            }
        );

    } catch (error) {

        console.error("Load Orders Error:", error);

        if (checkNumber !== authCheckNumber) return;

        handleOrdersError(error);
    }
}


// ==========================================
// متابعة تسجيل الدخول
// ==========================================

onAuthStateChanged(auth, async user => {

    const checkNumber = ++authCheckNumber;

    stopOrdersListener();

    currentUser = user;

    currentRole = null;

    container.innerHTML = "";

    sectionHeading.classList.add("hidden");


    if (!user) {

        roleLabel.classList.add("hidden");

        pageTitle.textContent = "📦 طلباتي";

        pageDescription.textContent =
            "سجل دخولك لمتابعة طلباتك";

        showMessage(
            "يرجى تسجيل الدخول أولاً لعرض الطلبات.",
            "🔐",
            "تسجيل الدخول",
            () => {
                location.href = "login.html";
            }
        );

        return;
    }

    await loadOrdersForUser(user, checkNumber);
});

</script>
