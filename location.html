<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر منطقتك | سِلّتي</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f6;
    direction: rtl;
    color: #263238;
}

.header {
    background: #087f5b;
    color: white;
    padding: 25px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.box {
    background: white;
    max-width: 450px;
    margin: 35px auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #00000012;
}

.box h2 {
    color: #087f5b;
    text-align: center;
}

.box p {
    text-align: center;
    color: #666;
}

select {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    background: #087f5b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:active {
    background: #075c43;
}

.footer {
    text-align: center;
    color: #777;
    margin-top: 30px;
}
</style></head><body><header class="header">
    <h1>🛒 سِلّتي</h1>
    <p>طلبك من دكانك لحد بابك</p>
</header><div class="box"><h2>📍 حدد منطقتك</h2>

<p>اختر الحي الذي تسكن فيه</p>

<select id="city">
    <option value="شرق النيل">شرق النيل</option>
</select>

<select id="area">
    <option value="">اختر الحي</option>
    <option value="الحاج يوسف">الحاج يوسف</option>
    <option value="الفيحاء">الفيحاء</option>
    <option value="دار السلام">دار السلام</option>
    <option value="المايقوما">المايقوما</option>
    <option value="التكامل">التكامل</option>
    <option value="النصر">النصر</option>
    <option value="الردمية">الردمية</option>
    <option value="عد بابكر">عد بابكر</option>
    <option value="حي البركة">حي البركة</option>
</select>

<button onclick="saveLocation()">
    تأكيد المنطقة والدخول
</button>

</div><div class="footer">
    <p>سِلّتي 💚 تسوق بسهولة من منطقتك</p>
</div><script>
function saveLocation() {

    let city = document.getElementById("city").value;
    let area = document.getElementById("area").value;

    if (!area) {
        alert("الرجاء اختيار الحي أولاً");
        return;
    }

    let location = {
        city: city,
        area: area
    };

    localStorage.setItem(
        "silatiLocation",
        JSON.stringify(location)
    );

    alert("تم حفظ منطقتك بنجاح 💚");

    window.location.href = "index.html";
}
</script></body>
</html>
