<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متاجر سِلّتي</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f1f5f3;
    font-family: Arial, sans-serif;
    color: #26332e;
}

.header {
    background: #087f5b;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px #0002;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

.page-title {
    text-align: center;
    color: #087f5b;
    margin: 25px 0 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.stats {
    background: #e0f2eb;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    color: #087f5b;
    margin-bottom: 20px;
    font-weight: bold;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
    outline-color: #087f5b;
}

.store-card {
    background: white;
    padding: 20px;
    margin-bottom: 16px;
    border-radius: 13px;
    box-shadow: 0 3px 10px #00000010;
    transition: 0.2s;
}

.store-card h3 {
    color: #087f5b;
    margin-top: 0;
    font-size: 20px;
}

.store-info {
    line-height: 2;
    color: #555;
}

.products-count {
    display: inline-block;
    background: #e8f5e9;
    color: #087f5b;
    padding: 7px 12px;
    border-radius: 20px;
    margin-top: 8px;
    font-size: 14px;
}

.visit-btn {
    display: block;
    background: #087f5b;
    color: white;
    text-align: center;
    padding: 13px;
    border-radius: 8px;
    text-decoration: none;
    margin-top: 15px;
    font-weight: bold;
}

.visit-btn:active {
    background: #056747;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    line-height: 2;
}

.add-store {
    display: block;
    background: #1976d2;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 15px;
    border-radius: 9px;
    margin-top: 20px;
}

.back {
    display: block;
    text-align: center;
    color: #087f5b;
    text-decoration: none;
    margin: 20px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
    font-size: 13px;
}
</style></head><body><header class="header"><div class="logo">🛒 سِلّتي</div>

<div>
    <a href="cart.html">🛍️ السلة</a>
</div>

</header><div class="container"><h2 class="page-title">🏪 متاجر سِلّتي</h2>

<p class="subtitle">
    تسوق من متاجرك المفضلة في شرق النيل
</p>

<div class="stats" id="stats">
    جاري تحميل المتاجر...
</div>

<input
    type="search"
    class="search"
    id="searchInput"
    placeholder="🔍 ابحث عن متجر أو منطقة..."
    oninput="loadStores()"
>

<div id="storesList"></div>

<a href="merchant.html" class="add-store">
    ➕ تسجيل متجر جديد
</a>

<a href="index.html" class="back">
    العودة إلى الصفحة الرئيسية
</a>

</div><footer>
    سِلّتي | تسوق بسهولة من متاجرك المحلية 💚
</footer><script>

// قراءة قاعدة البيانات
function getData(key) {

    try {
        return JSON.parse(
            localStorage.getItem(key) || "[]"
        );
    } catch (error) {
        return [];
    }

}

// عرض المتاجر
function loadStores() {

    let stores = getData("silatiStores");

    let products = getData("silatiProducts");

    let container =
        document.getElementById("storesList");

    let stats =
        document.getElementById("stats");

    let search =
        document.getElementById("searchInput")
        .value.trim().toLowerCase();

    container.innerHTML = "";

    stats.textContent =
        "🏪 عدد المتاجر المسجلة: " + stores.length;

    if (stores.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>🏪 لا توجد متاجر حالياً</h3>
                <p>كن أول تاجر ينضم إلى سِلّتي.</p>
            </div>
        `;

        return;
    }

    let filteredStores = stores.filter(function(store) {

        let text =
            (store.name || "") + " " +
            (store.type || "") + " " +
            (store.region || "");

        return text.toLowerCase().includes(search);

    });

    if (filteredStores.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>🔍 لم نجد المتجر المطلوب</h3>
                <p>جرب البحث باسم آخر.</p>
            </div>
        `;

        return;
    }

    filteredStores.forEach(function(store) {

        let count = products.filter(function(product) {

            return product.storeId === store.id;

        }).length;

        let card = document.createElement("div");

        card.className = "store-card";

        let title = document.createElement("h3");

        title.textContent = "🏪 " + store.name;

        let info = document.createElement("div");

        info.className = "store-info";

        info.textContent =
            "📂 نوع النشاط: " + store.type +
            " | 📍 المنطقة: " + store.region;

        let productCount =
            document.createElement("div");

        productCount.className = "products-count";

        productCount.textContent =
            "📦 عدد المنتجات: " + count;

        let button = document.createElement("a");

        button.className = "visit-btn";

        button.textContent = "زيارة المتجر 🛒";

        button.href =
            "store.html?storeId=" +
            encodeURIComponent(store.id);

        card.appendChild(title);

        card.appendChild(info);

        card.appendChild(productCount);

        card.appendChild(button);

        container.appendChild(card);

    });

}

// تشغيل الصفحة
loadStores();

</script>
    <script src="bottom-nav.js" defer></script>
</body>
</html>
