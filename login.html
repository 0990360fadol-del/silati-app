<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>تسجيل الدخول | سِلّتي</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(145deg,#e5f5ed,#f1f5f3);
    color:#26332d;
    padding:20px;
    min-height:100vh;
}

.container{
    max-width:420px;
    margin:35px auto;
    background:white;
    padding:28px 24px;
    border-radius:22px;
    box-shadow:0 10px 35px #087f5b18;
    border:1px solid #e8f3ee;
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:#087f5b;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
    line-height:1.7;
}

.input-group{margin-bottom:15px}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
    color:#385448;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #dce8e1;
    border-radius:12px;
    font-size:16px;
    direction:ltr;
    outline:none;
    background:#fbfdfb;
}

input:focus{
    border-color:#087f5b;
    box-shadow:0 0 0 3px #087f5b15;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#087f5b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.secondary{
    background:#e8f5ee;
    color:#087f5b;
}

.forgot{
    display:block;
    text-align:left;
    color:#087f5b;
    font-size:14px;
    font-weight:bold;
    text-decoration:none;
    margin-top:10px;
}

#message{
    display:none;
    text-align:center;
    margin-top:22px;
    padding:15px;
    border-radius:14px;
    line-height:1.8;
    font-size:14px;
    overflow-wrap:anywhere;
}

.message-success{
    display:block!important;
    background:#e8f8ef;
    color:#087f5b;
    border:1px solid #bce8cf;
}

.message-error{
    display:block!important;
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffd0d0;
}

.message-info{
    display:block!important;
    background:#edf5ff;
    color:#245b91;
    border:1px solid #c9e0fa;
}

.welcome-card{
    display:none;
    text-align:center;
    background:linear-gradient(145deg,#e5f8ed,#f6fff9);
    border:1px solid #bde9ce;
    border-radius:18px;
    padding:24px 15px;
    margin-top:20px;
}

.welcome-icon{font-size:55px}

.welcome-card h2{color:#087f5b}

.welcome-card p{
    color:#547164;
    line-height:1.8;
}

.welcome-small{
    font-size:13px;
    color:#087f5b;
    font-weight:bold;
}

a.home{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#087f5b;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🛒 سِلّتي</div>

    <p class="subtitle">
        أهلاً بك في عالم التسوق السهل<br>
        طلبك لحد بابك 💚
    </p>

    <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            placeholder="أدخل بريدك الإلكتروني"
            autocomplete="email"
        >
    </div>

    <div class="input-group">
        <label>كلمة المرور</label>
        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
        >

        <a href="#" class="forgot" id="forgotBtn">
            🔑 نسيت كلمة المرور؟
        </a>
    </div>

    <button id="loginBtn">تسجيل الدخول</button>

    <button id="registerBtn" class="secondary">
        إنشاء حساب جديد
    </button>

    <div id="message"></div>

    <div class="welcome-card" id="welcomeCard">
        <div class="welcome-icon">🎉</div>

        <h2>مرحباً بك في عائلة سِلّتي!</h2>

        <p>
            تم إنشاء حسابك بنجاح،<br>
            وأصبحت الآن جزءاً من مجتمعنا.
        </p>

        <p class="welcome-small">
            🛒 تسوق بسهولة... وطلبك لحد بابك!
        </p>
    </div>

    <a href="index.html" class="home">
        ← العودة إلى الصفحة الرئيسية
    </a>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const message = document.getElementById("message");
const welcomeCard = document.getElementById("welcomeCard");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const forgotBtn = document.getElementById("forgotBtn");


// =================================
// عرض الرسائل
// =================================

function showMessage(text, type = "info") {

    message.textContent = text;
    message.className = "";
    message.classList.add("message-" + type);
    message.style.display = "block";

}

function hideMessage() {
    message.style.display = "none";
}


// =================================
// التحقق من المدخلات
// =================================

function getEmail() {

    const email = emailInput.value.trim();

    if (!email) {
        showMessage("يرجى إدخال البريد الإلكتروني.", "error");
        return null;
    }

    return email;
}


function getUserData() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage(
            "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
            "error"
        );
        return null;
    }

    if (password.length < 6) {
        showMessage(
            "كلمة المرور يجب ألا تقل عن 6 أحرف.",
            "error"
        );
        return null;
    }

    return { email, password };
}


// =================================
// التحكم في الأزرار
// =================================

function setLoading(loading) {

    loginBtn.disabled = loading;
    registerBtn.disabled = loading;
    forgotBtn.style.pointerEvents =
        loading ? "none" : "auto";

    loginBtn.textContent = loading
        ? "يرجى الانتظار..."
        : "تسجيل الدخول";

}


// =================================
// ترجمة أخطاء Firebase
// =================================

function getErrorMessage(error) {

    const code = error.code || "unknown";

    const messages = {

        "auth/invalid-email":
            "صيغة البريد الإلكتروني غير صحيحة.",

        "auth/user-not-found":
            "لا يوجد حساب مسجل بهذا البريد الإلكتروني.",

        "auth/wrong-password":
            "كلمة المرور غير صحيحة.",

        "auth/invalid-credential":
            "بيانات الدخول غير صحيحة. تحقق من البريد وكلمة المرور، أو تأكد من أن الحساب موجود في مشروع Firebase الحالي.",

        "auth/user-disabled":
            "هذا الحساب معطل في Firebase.",

        "auth/too-many-requests":
            "محاولات كثيرة. يرجى الانتظار والمحاولة لاحقاً.",

        "auth/network-request-failed":
            "تعذر الاتصال بالإنترنت أو بخوادم Firebase.",

        "auth/api-key-not-valid":
            "مفتاح Firebase غير صحيح.",

        "auth/email-already-in-use":
            "هذا البريد مسجل بالفعل. يمكنك تسجيل الدخول.",

        "auth/weak-password":
            "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",

        "permission-denied":
            "تم تسجيل الدخول، لكن Firestore رفض العملية بسبب الصلاحيات."

    };

    return (messages[code] || error.message || "حدث خطأ غير معروف")
        + "\n\nرمز الخطأ: " + code;

}


// =================================
// إنشاء حساب جديد
// =================================

registerBtn.addEventListener("click", async () => {

    const data = getUserData();

    if (!data) return;

    try {

        setLoading(true);
        welcomeCard.style.display = "none";

        showMessage(
            "✨ لحظات ونرحب بك في عائلة سِلّتي...",
            "info"
        );

        const result =
            await createUserWithEmailAndPassword(
                auth,
                data.email,
                data.password
            );

        const user = result.user;

        showMessage(
            "تم إنشاء الحساب، جارٍ تجهيز بياناته...",
            "info"
        );

        await setDoc(
            doc(db, "users", user.uid),
            {
                uid: user.uid,
                email: user.email,
                role: "customer",
                createdAt: serverTimestamp()
            }
        );

        hideMessage();

        welcomeCard.style.display = "block";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 3500);

    } catch (error) {

        console.error("خطأ إنشاء الحساب:", error);

        let text;

        if (error.code === "permission-denied") {

            text =
                "تم إنشاء حساب المصادقة، لكن تعذر حفظ بياناته في Firestore. "
                + getErrorMessage(error);

        } else {

            text = getErrorMessage(error);

        }

        showMessage(text, "error");

    } finally {

        setLoading(false);

    }

});


// =================================
// تسجيل الدخول
// =================================

loginBtn.addEventListener("click", async () => {

    const data = getUserData();

    if (!data) return;

    try {

        setLoading(true);
        welcomeCard.style.display = "none";

        showMessage(
            "🔐 جارٍ التحقق من بياناتك...",
            "info"
        );

        const result =
            await signInWithEmailAndPassword(
                auth,
                data.email,
                data.password
            );

        console.log(
            "تم تسجيل الدخول:",
            result.user.uid
        );

        showMessage(
            "تم تسجيل الدخول بنجاح! أهلاً بعودتك 💚",
            "success"
        );

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    } catch (error) {

        console.error(
            "تفاصيل خطأ تسجيل الدخول:",
            error.code,
            error.message
        );

        showMessage(
            getErrorMessage(error),
            "error"
        );

    } finally {

        setLoading(false);

    }

});


// =================================
// استعادة كلمة المرور
// =================================

forgotBtn.addEventListener("click", async (event) => {

    event.preventDefault();

    const email = getEmail();

    if (!email) return;

    try {

        setLoading(true);

        showMessage(
            "📨 جارٍ إرسال رابط استعادة كلمة المرور...",
            "info"
        );

        await sendPasswordResetEmail(auth, email);

        showMessage(
            "📩 تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. افتح الرسالة واتبع التعليمات.",
            "success"
        );

    } catch (error) {

        console.error(
            "خطأ استعادة كلمة المرور:",
            error.code,
            error.message
        );

        showMessage(
            getErrorMessage(error),
            "error"
        );

    } finally {

        setLoading(false);

    }

});

</script>

<script src="bottom-nav.js" defer></script>

</body>
</html>
