<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | سِلّتي</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #e5f5ed, #f1f5f3);
    color: #26332d;
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 420px;
    margin: 35px auto;
    background: white;
    padding: 28px 24px;
    border-radius: 22px;
    box-shadow: 0 10px 35px #087f5b18;
    border: 1px solid #e8f3ee;
}

.logo {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    color: #087f5b;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
    line-height: 1.7;
}

.input-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #385448;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #dce8e1;
    border-radius: 12px;
    font-size: 16px;
    direction: ltr;
    outline: none;
    transition: .3s;
    background: #fbfdfb;
}

input:focus {
    border-color: #087f5b;
    box-shadow: 0 0 0 3px #087f5b15;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #087f5b;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.secondary {
    background: #e8f5ee;
    color: #087f5b;
}

.forgot {
    display: block;
    text-align: left;
    color: #087f5b;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    margin-top: 10px;
    cursor: pointer;
}

.forgot:hover {
    text-decoration: underline;
}

/* صندوق الرسائل */

#message {
    display: none;
    text-align: center;
    margin-top: 22px;
    padding: 15px;
    border-radius: 14px;
    line-height: 1.8;
    font-size: 14px;
    animation: appear .4s ease;
}

.message-success {
    display: block !important;
    background: #e8f8ef;
    color: #087f5b;
    border: 1px solid #bce8cf;
}

.message-error {
    display: block !important;
    background: #fff0f0;
    color: #c62828;
    border: 1px solid #ffd0d0;
}

.message-info {
    display: block !important;
    background: #edf5ff;
    color: #245b91;
    border: 1px solid #c9e0fa;
}

/* بطاقة نجاح التسجيل */

.welcome-card {
    display: none;
    text-align: center;
    background: linear-gradient(145deg, #e5f8ed, #f6fff9);
    border: 1px solid #bde9ce;
    border-radius: 18px;
    padding: 24px 15px;
    margin-top: 20px;
    animation: appear .6s ease;
}

.welcome-icon {
    font-size: 55px;
    margin-bottom: 10px;
    animation: bounce 1s ease infinite alternate;
}

.welcome-card h2 {
    color: #087f5b;
    margin: 8px 0;
    font-size: 22px;
}

.welcome-card p {
    color: #547164;
    line-height: 1.8;
    margin: 8px 0;
}

.welcome-card .welcome-small {
    font-size: 13px;
    color: #087f5b;
    font-weight: bold;
}

a.home {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #087f5b;
    text-decoration: none;
    font-weight: bold;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-7px); }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">🛒 سِلّتي</div>

    <p class="subtitle">
        أهلاً بك في عالم التسوق السهل<br>
        طلبك لحد بابك 💚
    </p>

    <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            placeholder="أدخل بريدك الإلكتروني"
            autocomplete="email"
        >
    </div>

    <div class="input-group">
        <label>كلمة المرور</label>
        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
        >

        <a href="#" class="forgot" id="forgotBtn">
            🔑 نسيت كلمة المرور؟
        </a>
    </div>

    <button id="loginBtn">
        تسجيل الدخول
    </button>

    <button id="registerBtn" class="secondary">
        إنشاء حساب جديد
    </button>

    <div id="message"></div>

    <div class="welcome-card" id="welcomeCard">

        <div class="welcome-icon">🎉</div>

        <h2>مرحباً بك في عائلة سِلّتي!</h2>

        <p>
            تم إنشاء حسابك بنجاح،<br>
            وأصبحت الآن جزءاً من مجتمعنا.
        </p>

        <p class="welcome-small">
            🛒 تسوق بسهولة... وطلبك لحد بابك!
        </p>

    </div>

    <a href="index.html" class="home">
        ← العودة إلى الصفحة الرئيسية
    </a>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const message = document.getElementById("message");
const welcomeCard = document.getElementById("welcomeCard");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const forgotBtn = document.getElementById("forgotBtn");


function showMessage(text, type = "info") {

    message.textContent = text;

    message.className = "";

    message.classList.add("message-" + type);

    message.style.display = "block";

}

function hideMessage() {
    message.style.display = "none";
}

function getEmail() {

    const email = emailInput.value.trim();

    if (!email) {
        showMessage("يرجى إدخال البريد الإلكتروني أولاً", "error");
        return null;
    }

    return email;
}

function getUserData() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage(
            "يرجى إدخال البريد الإلكتروني وكلمة المرور",
            "error"
        );
        return null;
    }

    if (password.length < 6) {
        showMessage(
            "كلمة المرور يجب ألا تقل عن 6 أحرف",
            "error"
        );
        return null;
    }

    return { email, password };
}

function setLoading(loading) {

    loginBtn.disabled = loading;
    registerBtn.disabled = loading;
    forgotBtn.style.pointerEvents = loading ? "none" : "auto";

}


// =================================
// إنشاء حساب جديد
// =================================

registerBtn.addEventListener("click", async () => {

    const data = getUserData();

    if (!data) return;

    try {

        setLoading(true);

        welcomeCard.style.display = "none";

        showMessage("✨ لحظات ونرحب بك في عائلة سِلّتي...", "info");

        const result = await createUserWithEmailAndPassword(
            auth,
            data.email,
            data.password
        );

        const user = result.user;

        showMessage("تم إنشاء الحساب، جارٍ تجهيز ملفك...", "info");

        await setDoc(
            doc(db, "users", user.uid),
            {
                uid: user.uid,
                email: user.email,
                role: "customer",
                createdAt: serverTimestamp()
            }
        );

        hideMessage();

        welcomeCard.style.display = "block";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 3500);

    } catch (error) {

        console.error("خطأ إنشاء الحساب:", error);

        let errorText = "تعذر إنشاء الحساب. ";

        if (error.code === "auth/email-already-in-use") {
            errorText = "هذا البريد مسجل بالفعل. يمكنك تسجيل الدخول مباشرة.";
        }
        else if (error.code === "auth/invalid-email") {
            errorText = "البريد الإلكتروني غير صحيح.";
        }
        else if (error.code === "auth/weak-password") {
            errorText = "كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل.";
        }
        else if (error.code === "permission-denied") {
            errorText = "تم إنشاء الحساب، لكن تعذر حفظ بياناته. تحقق من صلاحيات Firestore.";
        }
        else {
            errorText += error.message;
        }

        showMessage(errorText, "error");

    } finally {

        setLoading(false);

    }

});


// =================================
// تسجيل الدخول
// =================================

loginBtn.addEventListener("click", async () => {

    const data = getUserData();

    if (!data) return;

    try {

        setLoading(true);

        welcomeCard.style.display = "none";

        showMessage("🔐 جارٍ التحقق من بياناتك...", "info");

        await signInWithEmailAndPassword(
            auth,
            data.email,
            data.password
        );

        showMessage("تم تسجيل الدخول بنجاح! أهلاً بعودتك 💚", "success");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    } catch (error) {

        console.error("خطأ تسجيل الدخول:", error);

        let errorText = "تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.";

        if (error.code === "auth/user-not-found") {
            errorText = "هذا البريد غير مسجل. يمكنك إنشاء حساب جديد.";
        }
        else if (error.code === "auth/wrong-password" ||
                 error.code === "auth/invalid-credential") {
            errorText = "البريد أو كلمة المرور غير صحيحة.";
        }
        else if (error.code === "auth/too-many-requests") {
            errorText = "محاولات كثيرة. حاول مرة أخرى لاحقاً.";
        }

        showMessage(errorText, "error");

    } finally {

        setLoading(false);

    }

});


// =================================
// استعادة كلمة المرور
// =================================

forgotBtn.addEventListener("click", async (event) => {

    event.preventDefault();

    const email = getEmail();

    if (!email) return;

    try {

        setLoading(true);

        showMessage("📨 جارٍ إرسال رابط استعادة كلمة المرور...", "info");

        await sendPasswordResetEmail(auth, email);

        showMessage(
            "📩 تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني. افتح الرسالة واتبع التعليمات لاختيار كلمة مرور جديدة.",
            "success"
        );

    } catch (error) {

        console.error("خطأ استعادة كلمة المرور:", error);

        let errorText = "تعذر إرسال رابط الاستعادة. حاول مرة أخرى.";

        if (error.code === "auth/invalid-email") {
            errorText = "صيغة البريد الإلكتروني غير صحيحة.";
        }
        else if (error.code === "auth/too-many-requests") {
            errorText = "طلبات كثيرة. حاول مرة أخرى لاحقاً.";
        }

        showMessage(errorText, "error");

    } finally {

        setLoading(false);

    }

});

</script>

<script src="bottom-nav.js" defer></script>

</body>
</html>
