<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجر سِلّتي</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding-bottom: 90px;
    background: #f1f5f3;
    font-family: Arial, sans-serif;
    color: #26332e;
}

.header {
    background: #087f5b;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.cart a {
    color: white;
    text-decoration: none;
}

.stores {
    max-width: 750px;
    margin: 20px auto;
    padding: 15px;
}

.store-info {
    background: linear-gradient(135deg, white, #e3f5ed);
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.store-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.store-info p {
    color: #66736c;
    line-height: 1.8;
}

.search-box {
    width: 100%;
    padding: 14px;
    margin: 10px 0 18px;
    border: 1px solid #dce9e2;
    border-radius: 12px;
    font-size: 15px;
    background: white;
    outline: none;
}

.search-box:focus {
    border-color: #087f5b;
    box-shadow: 0 0 0 3px #087f5b18;
}

.store-card {
    background: white;
    padding: 17px;
    margin: 13px 0;
    border-radius: 14px;
    box-shadow: 0 2px 8px #0000000c;
    animation: appear .35s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.store-card h3 {
    color: #087f5b;
}

.product-price {
    font-weight: bold;
    color: #087f5b;
    font-size: 18px;
}

.quantity-select {
    display: block;
    width: 100%;
    padding: 11px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    font-size: 16px;
}

.store-card button.add-button {
    width: 100%;
    background: #087f5b;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
}

.favorite-btn {
    background: #fff0f0;
    color: #e53935;
    border: none;
    padding: 9px 13px;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    margin: 7px 0 12px;
}

.favorite-btn.saved {
    background: #ffe1e1;
}

.empty-message {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    line-height: 1.9;
    color: #777;
}

.back-link {
    display: block;
    text-align: center;
    margin: 20px;
    color: #087f5b;
    text-decoration: none;
}

/* شريط التنقل السفلي */

.bottom-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e5eee9;
    box-shadow: 0 -3px 15px #00000012;
    padding: 9px 4px;
    padding-bottom: calc(9px + env(safe-area-inset-bottom));
}

.nav-item {
    flex: 1;
    text-align: center;
    text-decoration: none;
    color: #89958f;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
}

.nav-icon {
    position: relative;
    font-size: 23px;
}

.nav-item.active {
    color: #087f5b;
    font-weight: bold;
}

.cart-badge {
    position: absolute;
    top: -7px;
    right: -12px;
    background: #e53935;
    color: white;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
}

.cart-badge.show {
    display: flex;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">🛒 سِلّتي</div>

    <div class="cart">
        <a href="cart.html">🛍️ السلة</a>
    </div>

</header>

<section class="stores">

    <div class="store-info">

        <h2 id="storeTitle">🏪 جاري تحميل المتجر...</h2>

        <p id="storeWelcome"></p>

        <p id="storeDetails"></p>

    </div>

    <h3>🔍 ابحث في منتجات المتجر</h3>

    <input
        type="search"
        id="productSearch"
        class="search-box"
        placeholder="اكتب اسم المنتج..."
    >

    <h3>📦 منتجات المتجر</h3>

    <div id="productsContainer">

        <div class="empty-message">
            جارٍ تحميل المنتجات...
        </div>

    </div>

    <a href="stores.html" class="back-link">
        ← العودة إلى جميع المتاجر
    </a>

</section>

<!-- شريط التنقل -->

<nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>الرئيسية</span>
    </a>

    <a href="stores.html" class="nav-item">
        <span class="nav-icon">🏪</span>
        <span>المتاجر</span>
    </a>

    <a href="cart.html" class="nav-item">
        <span class="nav-icon">
            🛒
            <span class="cart-badge" id="cartBadge">0</span>
        </span>
        <span>السلة</span>
    </a>

    <a href="my-orders.html" class="nav-item">
        <span class="nav-icon">📦</span>
        <span>طلباتي</span>
    </a>

    <a href="login.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>حسابي</span>
    </a>

</nav>

<script src="app.js"></script>

<script>

/* قراءة البيانات المحفوظة */

function readStorage(key, fallback) {
    try {
        const value = JSON.parse(localStorage.getItem(key));
        return value === null ? fallback : value;
    } catch (error) {
        return fallback;
    }
}

/* عداد السلة */

function updateCartBadge() {

    const cart = readStorage("silatiCart", []);

    const count = Array.isArray(cart)
        ? cart.reduce((sum, item) =>
            sum + Math.max(0, Number(item.quantity) || 0), 0)
        : 0;

    const badge = document.getElementById("cartBadge");

    badge.textContent = count > 99 ? "99+" : count;

    badge.classList.toggle("show", count > 0);
}

updateCartBadge();

/* المفضلة */

function getFavorites() {
    const list = readStorage("silatiFavorites", []);
    return Array.isArray(list) ? list : [];
}

function isFavorite(id) {
    return getFavorites().some(item =>
        item.type === "product" && item.id === id
    );
}

function toggleFavorite(id) {

    let favorites = getFavorites();

    const index = favorites.findIndex(item =>
        item.type === "product" && item.id === id
    );

    if (index >= 0) {
        favorites.splice(index, 1);
    } else {
        favorites.push({
            type: "product",
            id: id
        });
    }

    localStorage.setItem(
        "silatiFavorites",
        JSON.stringify(favorites)
    );

    displayProducts(currentProducts);
}

/* بيانات المتجر */

let currentStore = null;
let currentProducts = [];

/* عناصر الصفحة */

const titleElement = document.getElementById("storeTitle");
const welcomeElement = document.getElementById("storeWelcome");
const detailsElement = document.getElementById("storeDetails");
const container = document.getElementById("productsContainer");
const searchInput = document.getElementById("productSearch");

/* معرّف المتجر */

const params = new URLSearchParams(window.location.search);

const requestedStoreId =
    params.get("id") ||
    params.get("storeId");

/* تحميل المتجر */

async function loadStore() {

    if (!requestedStoreId) {

        showError(
            "لم يتم تحديد المتجر",
            "ارجع إلى قائمة المتاجر واختر المتجر الذي تريد تصفحه."
        );

        return;
    }

    try {

        const storeRef = doc(
            db,
            "stores",
            String(requestedStoreId)
        );

        const storeSnapshot = await getDoc(storeRef);

        if (!storeSnapshot.exists()) {

            showError(
                "المتجر غير موجود",
                "لم نتمكن من العثور على بيانات هذا المتجر."
            );

            return;
        }

        currentStore = {
            id: storeSnapshot.id,
            ...storeSnapshot.data()
        };

        titleElement.textContent =
            "🏪 " + currentStore.name;

        welcomeElement.textContent =
            "مرحباً بك في " + currentStore.name + " 💚";

        detailsElement.textContent =
            (currentStore.type || "متجر عام") +
            (currentStore.region
                ? " | 📍 " + currentStore.region
                : "");

        await loadProducts();

    } catch (error) {

        console.error("خطأ تحميل المتجر:", error);

        showError(
            "تعذر تحميل المتجر",
            "حدث خطأ أثناء الاتصال بقاعدة البيانات."
        );

    }
}

/* تحميل المنتجات */

async function loadProducts() {

    container.innerHTML =
        '<div class="empty-message">جاري تحميل المنتجات...</div>';

    try {

        const productsRef = collection(db, "products");

        const productsQuery = query(
            productsRef,
            where("storeId", "==", String(currentStore.id))
        );

        const snapshot = await getDocs(productsQuery);

        currentProducts = [];

        snapshot.forEach(productDoc => {

            const data = productDoc.data();

            currentProducts.push({
                id: productDoc.id,
                ...data
            });

        });

        displayProducts(currentProducts);

    } catch (error) {

        console.error("خطأ تحميل المنتجات:", error);

        container.innerHTML =
            '<div class="empty-message">تعذر تحميل المنتجات من قاعدة البيانات.</div>';

    }

}

/* عرض المنتجات */

function displayProducts(products) {

    container.innerHTML = "";

    const search = searchInput.value.trim().toLowerCase();

    const filtered = products.filter(product => {

        const valid =
            product.name &&
            Number.isFinite(Number(product.price)) &&
            Number(product.price) > 0;

        return valid &&
            product.name.toLowerCase().includes(search);
    });

    if (filtered.length === 0) {

        container.innerHTML =
            '<div class="empty-message">لا توجد منتجات تطابق بحثك حالياً.</div>';

        return;
    }

    filtered.forEach(product => {

        createProductCard(product);

    });

}

/* بطاقة المنتج */

function createProductCard(product) {

    const card = document.createElement("div");

    card.className = "store-card";

    const title = document.createElement("h3");

    title.textContent =
        (product.icon || "📦") + " " + product.name;

    const priceElement = document.createElement("p");

    priceElement.className = "product-price";

    priceElement.textContent =
        "السعر: " +
        Number(product.price).toLocaleString("ar") +
        " جنيه";

    const favoriteButton = document.createElement("button");

    favoriteButton.className = "favorite-btn";

    function updateFavoriteButton() {

        const saved = isFavorite(product.id);

        favoriteButton.textContent =
            saved ? "❤️ في المفضلة" : "🤍 أضف للمفضلة";

        favoriteButton.classList.toggle("saved", saved);
    }

    updateFavoriteButton();

    favoriteButton.onclick = () => {
        toggleFavorite(product.id);
    };

    const quantityLabel = document.createElement("label");

    quantityLabel.textContent = "اختر الكمية:";

    const quantitySelect = document.createElement("select");

    quantitySelect.className = "quantity-select";

    for (let i = 1; i <= 20; i++) {

        const option = document.createElement("option");

        option.value = i;
        option.textContent = i;

        quantitySelect.appendChild(option);
    }

    const button = document.createElement("button");

    button.className = "add-button";

    button.textContent = "أضف إلى السلة 🛒";

    button.addEventListener("click", function() {

        const quantity = Number(quantitySelect.value);

        if (typeof window.addToCart !== "function") {

            alert("تعذر تشغيل السلة. تحقق من ملف app.js.");

            return;
        }

        window.addToCart(
            product.name,
            Number(product.price),
            quantity,
            currentStore.id,
            currentStore.name
        );

        updateCartBadge();

    });

    card.appendChild(title);
    card.appendChild(priceElement);
    card.appendChild(favoriteButton);
    card.appendChild(quantityLabel);
    card.appendChild(quantitySelect);
    card.appendChild(button);

    container.appendChild(card);
}

/* البحث */

searchInput.addEventListener("input", function() {
    displayProducts(currentProducts);
});

/* الأخطاء */

function showError(title, message) {

    titleElement.textContent = title;

    welcomeElement.textContent = message;

    detailsElement.textContent = "";

    container.innerHTML =
        '<div class="empty-message">' + message + '</div>';

}

window.addEventListener("storage", updateCartBadge);

</script>

<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

window.db = db;

/* تشغيل تحميل المتجر بعد تجهيز Firebase */

window.addEventListener("silatiFirebaseReady", () => {});

</script>

<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

/* توفير دوال Firebase للصفحة */

window.doc = doc;
window.getDoc = getDoc;
window.collection = collection;
window.getDocs = getDocs;
window.query = query;
window.where = where;

window.dispatchEvent(new Event("silatiFirebaseReady"));

</script>

</body>
</html>
