<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجر سِلّتي</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f1f5f3;
    font-family: Arial, sans-serif;
    color: #26332e;
}

.header {
    background: #087f5b;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.cart a {
    color: white;
    text-decoration: none;
}

.stores {
    max-width: 750px;
    margin: 20px auto;
    padding: 15px;
}

.store-info {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #00000012;
}

.store-info h2 {
    color: #087f5b;
    margin-top: 0;
}

.store-card {
    background: white;
    padding: 15px;
    margin: 12px 0;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000012;
}

.store-card h3 {
    color: #087f5b;
}

.product-price {
    font-weight: bold;
    color: #087f5b;
    font-size: 17px;
}

.quantity-select {
    display: block;
    width: 100%;
    padding: 11px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    font-size: 16px;
}

.store-card button {
    width: 100%;
    background: #087f5b;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
}

.empty-message {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    line-height: 1.8;
}

.back-link {
    display: block;
    text-align: center;
    margin: 20px;
    color: #087f5b;
    text-decoration: none;
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">🛒 سِلّتي</div>

    <div class="cart">
        <a href="cart.html">🛍️ السلة</a>
    </div>

</header>

<section class="stores">

    <div class="store-info">

        <h2 id="storeTitle">🏪 جاري تحميل المتجر...</h2>

        <p id="storeWelcome"></p>

        <p id="storeDetails"></p>

    </div>

    <h3>📦 منتجات المتجر</h3>

    <div id="productsContainer">
        <div class="empty-message">
            جارٍ تحميل المنتجات...
        </div>
    </div>

    <a href="stores.html" class="back-link">
        ← العودة إلى جميع المتاجر
    </a>

</section>

<script src="app.js"></script>

<script type="module">

// الاتصال بقاعدة البيانات

import { db } from "./firebase.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


// عناصر الصفحة

const titleElement = document.getElementById("storeTitle");
const welcomeElement = document.getElementById("storeWelcome");
const detailsElement = document.getElementById("storeDetails");
const container = document.getElementById("productsContainer");

let currentStore = null;


// قراءة معرّف المتجر من الرابط
// نقبل id أو storeId

const params = new URLSearchParams(window.location.search);

const requestedStoreId =
    params.get("id") ||
    params.get("storeId");


// تحميل بيانات المتجر

async function loadStore() {

    if (!requestedStoreId) {

        showError(
            "لم يتم تحديد المتجر",
            "ارجع إلى قائمة المتاجر واختر المتجر الذي تريد تصفحه."
        );

        return;
    }

    try {

        const storeRef = doc(
            db,
            "stores",
            String(requestedStoreId)
        );

        const storeSnapshot = await getDoc(storeRef);

        if (!storeSnapshot.exists()) {

            showError(
                "المتجر غير موجود",
                "لم نتمكن من العثور على بيانات هذا المتجر."
            );

            return;
        }

        currentStore = {
            id: storeSnapshot.id,
            ...storeSnapshot.data()
        };

        titleElement.textContent =
            "🏪 " + currentStore.name;

        welcomeElement.textContent =
            "مرحباً بك في " + currentStore.name;

        detailsElement.textContent =
            (currentStore.type || "") +
            (currentStore.region
                ? " | " + currentStore.region
                : "");

        await loadProducts();

    } catch (error) {

        console.error("خطأ تحميل المتجر:", error);

        showError(
            "تعذر تحميل المتجر",
            "حدث خطأ أثناء الاتصال بقاعدة البيانات. تحقق من الإنترنت وحاول مجدداً."
        );

    }

}


// تحميل المنتجات من Firebase

async function loadProducts() {

    container.innerHTML =
        '<div class="empty-message">جاري تحميل المنتجات...</div>';

    try {

        const productsRef = collection(db, "products");

        const productsQuery = query(
            productsRef,
            where("storeId", "==", String(currentStore.id))
        );

        const snapshot = await getDocs(productsQuery);

        const products = [];

        snapshot.forEach(productDoc => {

            const data = productDoc.data();

            products.push({
                id: productDoc.id,
                ...data
            });

        });

        displayProducts(products);

    } catch (error) {

        console.error("خطأ تحميل المنتجات:", error);

        container.innerHTML =
            '<div class="empty-message">' +
            'تعذر تحميل المنتجات من قاعدة البيانات.<br>' +
            'يرجى المحاولة مرة أخرى.' +
            '</div>';

    }

}


// عرض المنتجات

function displayProducts(products) {

    container.innerHTML = "";

    products = products.filter(product =>

        product.name &&
        Number.isFinite(Number(product.price)) &&
        Number(product.price) > 0

    );

    if (products.length === 0) {

        container.innerHTML =
            '<div class="empty-message">' +
            'لا توجد منتجات في هذا المتجر حالياً.<br>' +
            'سيتم عرض المنتجات هنا عندما يضيفها التاجر.' +
            '</div>';

        return;
    }

    products.forEach(product => {

        createProductCard(product);

    });

}


// إنشاء بطاقة المنتج

function createProductCard(product) {

    const card = document.createElement("div");

    card.className = "store-card";


    // اسم المنتج

    const title = document.createElement("h3");

    title.textContent =
        (product.icon || "📦") + " " + product.name;


    // السعر

    const priceElement = document.createElement("p");

    priceElement.className = "product-price";

    const price = Number(product.price);

    priceElement.textContent =
        "السعر: " + price.toLocaleString("ar") + " جنيه";


    // اختيار الكمية

    const quantityLabel = document.createElement("label");

    quantityLabel.textContent = "اختر الكمية:";

    const quantitySelect = document.createElement("select");

    quantitySelect.className = "quantity-select";

    for (let i = 1; i <= 20; i++) {

        const option = document.createElement("option");

        option.value = i;

        option.textContent = i;

        quantitySelect.appendChild(option);

    }


    // زر الإضافة للسلة

    const button = document.createElement("button");

    button.textContent = "أضف إلى السلة 🛒";

    button.addEventListener("click", function() {

        const quantity = Number(quantitySelect.value);

        if (typeof window.addToCart !== "function") {

            alert(
                "تعذر تشغيل السلة. تحقق من ملف app.js."
            );

            return;
        }

        window.addToCart(
            product.name,
            price,
            quantity,
            currentStore.id,
            currentStore.name
        );

    });


    card.appendChild(title);

    card.appendChild(priceElement);

    card.appendChild(quantityLabel);

    card.appendChild(quantitySelect);

    card.appendChild(button);

    container.appendChild(card);

}


// رسائل الخطأ

function showError(title, message) {

    titleElement.textContent = title;

    welcomeElement.textContent = message;

    detailsElement.textContent = "";

    container.innerHTML =
        '<div class="empty-message">' +
        message +
        '</div>';

}


// تشغيل الصفحة

loadStore();

</script>

</body>
</html>
